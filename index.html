const emptyDb = () => ({

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null, resetting: false };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  handleReset = async () => {
    this.setState({ resetting: true });
    try {
      await DOC_REF.set(emptyDb());
    } catch (e) {
      // even if this fails, clearing local state below still recovers the UI
    }
    this.setState({ error: null, resetting: false });
  };
  render() {
    if (this.state.error) {
      return (
        <div className="min-h-screen flex items-center justify-center bg-[#F9F5EC] p-6">
          <div className="max-w-sm text-center">
            <p className="text-[#a8532a] font-semibold mb-2">Something went wrong loading your records.</p>
            <p className="text-xs text-[#75716A] mb-4">
              This can happen if the shared data got into a bad state, or if the Firebase config
              above hasn't been filled in yet. Resetting will clear all saved sites, cottages,
              customers, and work orders and start fresh.
            </p>
            <button
              onClick={this.handleReset}
              disabled={this.state.resetting}
              className="px-4 py-2 rounded-md bg-[#377249] text-[#F9F5EC] text-sm font-medium hover:bg-[#135C30] disabled:opacity-60"
            >
              {this.state.resetting ? "Resetting…" : "Reset all data"}
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function useDb() {
  const [db, setDb] = useState(null);
  const [loading, setLoading] = useState(true);
  const [connectionError, setConnectionError] = useState(null);
  const [saveError, setSaveError] = useState(null);
  const lastAttempt = useRef(null);

  useEffect(() => {
    const unsub = DOC_REF.onSnapshot(
      (snap) => {
        const data = snap.exists ? snap.data() : null;
        setDb({ ...emptyDb(), ...(data && typeof data === "object" ? data : {}) });
        setLoading(false);
        setConnectionError(null);
      },
      (err) => {
        setConnectionError(`Couldn't connect to the shared database${err?.message ? `: ${err.message}` : ""}.`);
        setDb((cur) => cur || emptyDb());
        setLoading(false);
      }
    );
    return () => unsub();
  }, []);

  const persist = useCallback(async (next) => {
    setDb(next); // update the UI immediately
    lastAttempt.current = next;
    try {
      await DOC_REF.set(next);
      setSaveError(null);
    } catch (e) {
      setSaveError(`Couldn't save that change${e?.message ? `: ${e.message}` : ""}. Try again.`);
    }
  }, []);

  const error = saveError || connectionError;

  const retry = useCallback(() => {
    if (lastAttempt.current) persist(lastAttempt.current);
  }, [persist]);

  return { db, loading, error, persist, retry };
}

// ---------- Small UI atoms ----------

function IconTag({ className = "" }) {

    <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth="1.6">

function Field({ label, children }) {

const inputCls =

function Modal({ title, onClose, children, wide }) {

            ✕
          </button>
        </div>

      </div>
    </div>

}

function ConfirmDeleteModal({ label, onConfirm, onCancel }) {
  return (
    <Modal title="Confirm delete" onClose={onCancel}>
      <p className="text-sm text-[#4B4740] mb-5">
        Delete <span className="font-semibold">{label}</span>? This can't be undone.
      </p>
      <div className="flex justify-end gap-2">
        <button
          onClick={onCancel}
          style={{ padding: "8px 16px", fontSize: 14, borderRadius: 6, color: "#75716A", background: "transparent", border: "1px solid #E2DED5" }}
        >
          Cancel
        </button>
        <button
          onClick={onConfirm}
          style={{ padding: "8px 16px", fontSize: 14, borderRadius: 6, color: "#ffffff", backgroundColor: "#C1652F", fontWeight: 600, border: "none" }}
        >
          Yes, delete
        </button>
      </div>
    </Modal>
  );
}

function useConfirm() {
  const [target, setTarget] = useState(null);
  return {
    target,
    ask: (id) => setTarget(id),
    clear: () => setTarget(null),
  };
}

function EmptyState({ text, action }) {
  return (
    <div className="text-center py-16 border-2 border-dashed border-[#E2DED5] rounded-xl">
      <p className="text-[#75716A] text-sm mb-3">{text}</p>
      {action}
    </div>
  );
}

// ---------- Sites ----------

function SitesView({ db, persist }) {
  const [modal, setModal] = useState(null);
  const confirm = useConfirm();

  const save = (site) => {
    const exists = db.sites.some((s) => s.id === site.id);
    const sites = exists ? db.sites.map((s) => (s.id === site.id ? site : s)) : [...db.sites, site];
    persist({ ...db, sites });
    setModal(null);
  };

  const remove = (id) => {
    persist({ ...db, sites: db.sites.filter((s) => s.id !== id) });
    confirm.clear();
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <div>
          <h2 className="font-serif text-2xl text-[#377249] font-semibold">Sites</h2>
          <p className="text-sm text-[#75716A]">Site numbers, sections, and hookup notes.</p>
        </div>
        <button
          onClick={() => setModal({ mode: "new" })}
          className="px-4 py-2 rounded-md bg-[#377249] text-[#F9F5EC] text-sm font-medium hover:bg-[#135C30] transition shadow-sm"
        >
          + New Site
        </button>
      </div>

      {db.sites.length === 0 ? (
        <EmptyState
          text="No sites yet. Add your first site number to get started."
          action={
            <button onClick={() => setModal({ mode: "new" })} className="text-[#C1652F] text-sm font-medium underline">
              Add a site
            </button>
          }
        />
      ) : (
        <div className="overflow-x-auto rounded-lg border border-[#E2DED5]">
          <table className="w-full text-sm">
            <thead>
              <tr className="bg-[#F1EEE9] text-left text-[#75716A] uppercase text-[11px] tracking-wider">
                <th className="px-4 py-2.5">Site #</th>
                <th className="px-4 py-2.5">Section</th>
                <th className="px-4 py-2.5">Hookups</th>
                <th className="px-4 py-2.5">Notes</th>
                <th className="px-4 py-2.5 w-32"></th>
              </tr>
            </thead>
            <tbody>
              {db.sites
                .slice()
                .sort((a, b) => a.number.localeCompare(b.number, undefined, { numeric: true }))
                .map((s) => (
                  <tr key={s.id} className="border-t border-[#EEEBE5] hover:bg-[#FFFDFA]">
                    <td className="px-4 py-2.5 font-semibold text-[#1E1A13]">{s.number}</td>
                    <td className="px-4 py-2.5 text-[#4B4740]">{s.section || "—"}</td>
                    <td className="px-4 py-2.5 text-[#4B4740]">{s.hookups || "—"}</td>
                    <td className="px-4 py-2.5 text-[#4B4740] max-w-xs truncate">{s.notes || "—"}</td>
                    <td className="px-4 py-2.5 text-right">
                      <div className="flex gap-3 justify-end text-xs">
                        <button className="text-[#377249] hover:underline" onClick={() => setModal({ mode: "edit", data: s })}>
                          Edit
                        </button>
                        <button className="text-[#a8532a] hover:underline" onClick={() => confirm.ask(s.id)}>
                          Delete
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
            </tbody>
          </table>
        </div>
      )}

      {modal && (
        <Modal title={modal.mode === "new" ? "New Site" : "Edit Site"} onClose={() => setModal(null)}>
          <SiteForm initial={modal.data} onSave={save} onCancel={() => setModal(null)} />
        </Modal>
      )}

      {confirm.target && (
        <ConfirmDeleteModal
          label={`site ${db.sites.find((s) => s.id === confirm.target)?.number ?? ""}`}
          onConfirm={() => remove(confirm.target)}
          onCancel={confirm.clear}
        />
      )}
    </div>
  );
}

function SiteForm({ initial, onSave, onCancel }) {
  const [number, setNumber] = useState(initial?.number || "");
  const [section, setSection] = useState(initial?.section || "");
  const [hookups, setHookups] = useState(initial?.hookups || "");
  const [notes, setNotes] = useState(initial?.notes || "");

  const submit = () => {
    if (!number.trim()) return;
    onSave({ id: initial?.id || uid(), number: number.trim(), section: section.trim(), hookups: hookups.trim(), notes: notes.trim() });
  };

  return (
    <div onKeyDown={(e) => { if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") submit(); }}>
      <Field label="Site Number">
        <input className={inputCls} value={number} onChange={(e) => setNumber(e.target.value)} placeholder="e.g. 24" autoFocus />
      </Field>
      <Field label="Section / Loop">
        <input className={inputCls} value={section} onChange={(e) => setSection(e.target.value)} placeholder="e.g. North Loop" />
      </Field>
      <Field label="Hookups">
        <input className={inputCls} value={hookups} onChange={(e) => setHookups(e.target.value)} placeholder="e.g. 30A, water, sewer" />
      </Field>
      <Field label="Notes">
        <textarea className={inputCls} rows={3} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Access notes, terrain, etc." />
      </Field>
      <div className="flex justify-end gap-2 mt-4">
        <button type="button" onClick={onCancel} className="px-4 py-2 text-sm text-[#75716A] hover:bg-[#F1EEE9] rounded-md">
          Cancel
        </button>
        <button type="button" onClick={submit} className="px-4 py-2 text-sm bg-[#377249] text-[#F9F5EC] rounded-md hover:bg-[#135C30] font-medium">
          Save Site
        </button>
      </div>
    </div>
  );
}

const COLOR_SWATCH = {
  Red: "#B5432E", Blue: "#3C5E7A", Green: "#4E6B4C", Yellow: "#D3A73E",
  Brown: "#6B4A34", Grey: "#7C7A73", Gray: "#7C7A73", White: "#E8E4D8",
  Tan: "#C6A97A", Teal: "#3E7A72", Orange: "#C1652F", Purple: "#6E5178",
};

function colorDot(name) {
  const key = Object.keys(COLOR_SWATCH).find((k) => k.toLowerCase() === (name || "").trim().toLowerCase());

}

    persist({ ...db, cottages });
    setModal(null);

          <CottageForm initial={modal.data} sites={db.sites} onSave={save} onCancel={() => setModal(null)} />

          label={db.cottages.find((c) => c.id === confirm.target)?.name ?? "this cottage"}
          onConfirm={() => remove(confirm.target)}
          onCancel={confirm.clear}

function CottageForm({ initial, sites, onSave, onCancel }) {
  const [name, setName] = useState(initial?.name || "");
  const [color, setColor] = useState(initial?.color || "");
  const [siteId, setSiteId] = useState(initial?.siteId || "");
  const [features, setFeatures] = useState(initial?.features || "");

  const submit = () => {
    if (!name.trim()) return;
    onSave({ id: initial?.id || uid(), name: name.trim(), color: color.trim(), siteId: siteId || null, features: features.trim() });
  };

  return (
    <div onKeyDown={(e) => { if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") submit(); }}>
      <Field label="Cottage Name / Number">
        <input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Cottage 3 — Loon" autoFocus />
      </Field>
      <Field label="Colour">
        <input className={inputCls} value={color} onChange={(e) => setColor(e.target.value)} placeholder="e.g. Blue" />
      </Field>
      <Field label="Linked Site">
        <select className={inputCls} value={siteId} onChange={(e) => setSiteId(e.target.value)}>
          <option value="">Unassigned</option>
          {sites.map((s) => (
            <option key={s.id} value={s.id}>Site {s.number}</option>

        </select>
      </Field>
      <Field label="Features / Notes">
        <textarea className={inputCls} rows={2} value={features} onChange={(e) => setFeatures(e.target.value)} placeholder="e.g. 2BR, wood stove, lake view" />
      </Field>

function formatPrice(value) {
  const n = Number(value);
  return Number.isFinite(n) ? `$${n.toFixed(2)}` : "—";
}

function TaxRateControl({ db, persist }) {
  const taxRate = db.settings?.taxRate ?? 13;
  const [value, setValue] = useState(String(taxRate));

  useEffect(() => {
    setValue(String(db.settings?.taxRate ?? 13));
  }, [db.settings?.taxRate]);

  const commit = () => {
    const n = Number(value);
    const rate = Number.isFinite(n) && n >= 0 ? n : 0;
    persist({ ...db, settings: { ...(db.settings || {}), taxRate: rate } });
  };

  return (
    <div className="flex items-center gap-1.5 text-sm text-[#75716A]">
      <span className="whitespace-nowrap">Tax rate</span>
      <input
        type="number"
        min="0"
        step="0.1"
        value={value}
        onChange={(e) => setValue(e.target.value)}
        onBlur={commit}
        onKeyDown={(e) => {
          if (e.key === "Enter") {
            commit();
            e.currentTarget.blur();
          }
        }}
        className="w-16 rounded-md border border-[#E2DED5] bg-[#FFFDFA] px-2 py-1 text-sm text-[#1E1A13] focus:outline-none focus:ring-2 focus:ring-[#C1652F]/50 focus:border-[#C1652F]"
      />
      <span>%</span>
    </div>
  );
}

function QuoteForm({ initial, sites, cottages, customers, parts, taxRate, defaultLaborRate, defaultShopSuppliesPercent, onSave, onCancel }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [date, setDate] = useState(initial?.date || new Date().toISOString().slice(0, 10));
  const [status, setStatus] = useState(initial?.status || "Draft");
  const [siteId, setSiteId] = useState(initial?.siteId || "");
  const [cottageId, setCottageId] = useState(initial?.cottageId || "");
  const [customerId, setCustomerId] = useState(initial?.customerId || "");
  const [notes, setNotes] = useState(initial?.notes || "");
  const [lineItems, setLineItems] = useState(
    initial?.lineItems?.length ? initial.lineItems : [{ id: uid(), description: "", quantity: 1, unitPrice: 0 }]
  );
  const [partToAdd, setPartToAdd] = useState("");
  const [laborHours, setLaborHours] = useState(initial?.laborHours ?? "");
  const [laborRate, setLaborRate] = useState(initial?.laborRate ?? defaultLaborRate ?? 65);
  const [shopSuppliesPercent, setShopSuppliesPercent] = useState(initial?.shopSuppliesPercent ?? defaultShopSuppliesPercent ?? 5);
  const [serviceCall, setServiceCall] = useState(initial?.serviceCall ?? "");

  const updateLine = (id, field, value) => {
    setLineItems((items) => items.map((li) => (li.id === id ? { ...li, [field]: value } : li)));
  };

  const removeLine = (id) => {
    setLineItems((items) => (items.length > 1 ? items.filter((li) => li.id !== id) : items));
  };

  const addBlankLine = () => {
    setLineItems((items) => [...items, { id: uid(), description: "", quantity: 1, unitPrice: 0 }]);
  };

  const addPartLine = () => {
    const part = parts.find((p) => p.id === partToAdd);
    if (!part) return;
    setLineItems((items) => [...items, { id: uid(), description: part.name, quantity: 1, unitPrice: Number(part.price) || 0 }]);
    setPartToAdd("");
  };

  const lineItemsSubtotal = lineItems.reduce((sum, li) => sum + (Number(li.quantity) || 0) * (Number(li.unitPrice) || 0), 0);
  const laborCost = (Number(laborHours) || 0) * (Number(laborRate) || 0);
  const shopSupplies = (lineItemsSubtotal + laborCost) * ((Number(shopSuppliesPercent) || 0) / 100);
  const serviceCallAmt = Number(serviceCall) || 0;
  const subtotal = lineItemsSubtotal + laborCost + shopSupplies + serviceCallAmt;
  const tax = subtotal * (taxRate / 100);
  const total = subtotal + tax;

  const submit = () => {
    if (!title.trim()) return;
    const cleanItems = lineItems
      .filter((li) => li.description.trim())
      .map((li) => ({ id: li.id, description: li.description.trim(), quantity: Number(li.quantity) || 0, unitPrice: Number(li.unitPrice) || 0 }));
    onSave({
      id: initial?.id || uid(),
      title: title.trim(),
      date,
      status,
      siteId: siteId || null,
      cottageId: cottageId || null,
      customerId: customerId || null,
      notes: notes.trim(),
      lineItems: cleanItems,
      laborHours: Number(laborHours) || 0,
      laborRate: Number(laborRate) || 0,
      shopSuppliesPercent: Number(shopSuppliesPercent) || 0,
      serviceCall: Number(serviceCall) || 0,
    });
  };

  return (
    <div onKeyDown={(e) => { if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") submit(); }}>
      <div className="grid sm:grid-cols-2 gap-x-4">
        <Field label="Job Title">
          <input className={inputCls} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Deck repair estimate" autoFocus />
        </Field>
        <Field label="Date">
          <input type="date" className={inputCls} value={date} onChange={(e) => setDate(e.target.value)} />
        </Field>
        <Field label="Status">
          <select className={inputCls} value={status} onChange={(e) => setStatus(e.target.value)}>
            {QUOTE_STATUS.map((s) => (
              <option key={s} value={s}>{s}</option>
            ))}
          </select>
        </Field>
        <Field label="Customer">
          <select className={inputCls} value={customerId} onChange={(e) => setCustomerId(e.target.value)}>
            <option value="">None</option>
            {customers.map((c) => (
              <option key={c.id} value={c.id}>{c.name}</option>
            ))}
          </select>
        </Field>
        <Field label="Site">
          <select className={inputCls} value={siteId} onChange={(e) => setSiteId(e.target.value)}>
            <option value="">None</option>
            {sites.map((s) => (
              <option key={s.id} value={s.id}>Site {s.number}</option>
            ))}
          </select>
        </Field>
        <Field label="Cottage">
          <select className={inputCls} value={cottageId} onChange={(e) => setCottageId(e.target.value)}>
            <option value="">None</option>
            {cottages.map((c) => (
              <option key={c.id} value={c.id}>{c.name}</option>
            ))}
          </select>
        </Field>
      </div>

      <Field label="Notes">
        <textarea className={inputCls} rows={2} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Job details, scope of work, etc." />
      </Field>

      <div className="mt-4">
        <span className="block text-[11px] uppercase tracking-wider text-[#75716A] mb-2 font-semibold">Line Items</span>
        <div className="space-y-2">
          {lineItems.map((li) => (
            <div key={li.id} className="flex gap-2 items-center">
              <input
                className={inputCls + " flex-1"}
                value={li.description}
                onChange={(e) => updateLine(li.id, "description", e.target.value)}
                placeholder="Description"
              />
              <input
                type="number"
                min="0"
                step="1"
                className={inputCls + " w-16"}
                value={li.quantity}
                onChange={(e) => updateLine(li.id, "quantity", e.target.value)}
                placeholder="Qty"
              />
              <input
                type="number"
                min="0"
                step="0.01"
                className={inputCls + " w-24"}
                value={li.unitPrice}
                onChange={(e) => updateLine(li.id, "unitPrice", e.target.value)}
                placeholder="Unit $"
              />
              <button
                type="button"
                onClick={() => removeLine(li.id)}
                className="text-[#a8532a] hover:bg-[#F5E3D9] w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
                aria-label="Remove line"
              >
                ✕
              </button>
            </div>
          ))}
        </div>

        <div className="flex items-center gap-2 mt-3 flex-wrap">
          <button type="button" onClick={addBlankLine} className="text-xs text-[#377249] hover:underline font-medium">
            + Add line
          </button>
          {parts.length > 0 && (
            <div className="flex items-center gap-1.5 sm:ml-auto">
              <select
                className="rounded-md border border-[#E2DED5] bg-[#FFFDFA] px-2 py-1 text-xs text-[#1E1A13]"
                value={partToAdd}
                onChange={(e) => setPartToAdd(e.target.value)}
              >
                <option value="">Add from parts…</option>
                {parts.map((p) => (
                  <option key={p.id} value={p.id}>{p.name} ({formatPrice(p.price)})</option>
                ))}
              </select>
              <button
                type="button"
                onClick={addPartLine}
                disabled={!partToAdd}
                className="text-xs px-2 py-1 rounded-md border border-[#377249]/30 text-[#377249] hover:bg-[#377249]/10 disabled:opacity-40"
              >
                Add
              </button>
            </div>
          )}
        </div>
      </div>

      <div className="mt-5 pt-4 border-t border-[#EEEBE5]">
        <span className="block text-[11px] uppercase tracking-wider text-[#75716A] mb-2 font-semibold">Labor &amp; Extras</span>
        <div className="grid sm:grid-cols-2 gap-x-4">
          <Field label="Hours Worked">
            <input
              type="number"
              min="0"
              step="0.25"
              className={inputCls}
              value={laborHours}
              onChange={(e) => setLaborHours(e.target.value)}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function buildWorkOrderHtml(wo, db) {
  const site = db.sites.find((s) => s.id === wo.siteId);
  const cottage = db.cottages.find((c) => c.id === wo.cottageId);
  return `
    <div class="wo">
      <div class="wo-head">
        <div>
          <div class="label">Work Order</div>
          <h1>${escapeHtml(wo.title)}</h1>
        </div>
        <div class="meta">
          <div>Date: ${escapeHtml(wo.date)}</div>
          <div>Status: ${escapeHtml(wo.status)}</div>
        </div>
      </div>
      <table class="wo-table">
        <tr><td class="k">Site</td><td>${site ? escapeHtml(site.number) + (site.section ? ` (${escapeHtml(site.section)})` : "") : "—"}</td></tr>
        <tr><td class="k">Cottage</td><td>${cottage ? escapeHtml(cottage.name) + (cottage.color ? ` — ${escapeHtml(cottage.color)}` : "") : "—"}</td></tr>
        <tr><td class="k">Assigned to</td><td>${escapeHtml(wo.assignedTo || "—")}</td></tr>
        ${wo.completedDate ? `<tr><td class="k">Completed</td><td>${escapeHtml(wo.completedDate)}</td></tr>` : ""}
      </table>
      <div class="label">Description</div>
      <p class="desc">${escapeHtml(wo.description || "—")}</p>
      <div class="sign">
        <div class="sign-line">Completed by (signature)</div>
        <div class="sign-line">Date</div>
      </div>
    </div>`;
}

function computeQuoteTotals(quote, taxRate) {
  const lineItemsSubtotal = quote.lineItems.reduce((sum, li) => sum + (Number(li.quantity) || 0) * (Number(li.unitPrice) || 0), 0);
  const laborCost = (Number(quote.laborHours) || 0) * (Number(quote.laborRate) || 0);
  const shopSupplies = (lineItemsSubtotal + laborCost) * ((Number(quote.shopSuppliesPercent) || 0) / 100);
  const serviceCall = Number(quote.serviceCall) || 0;
  const subtotal = lineItemsSubtotal + laborCost + shopSupplies + serviceCall;
  const tax = subtotal * (taxRate / 100);
  return { lineItemsSubtotal, laborCost, shopSupplies, serviceCall, subtotal, tax, total: subtotal + tax };
}

function buildQuoteHtml(quote, db, taxRate) {
  const site = db.sites.find((s) => s.id === quote.siteId);
  const cottage = db.cottages.find((c) => c.id === quote.cottageId);
  const customer = db.customers.find((c) => c.id === quote.customerId);
  const { lineItemsSubtotal, laborCost, shopSupplies, serviceCall, subtotal, tax, total } = computeQuoteTotals(quote, taxRate);
  const rows = quote.lineItems
    .map(
      (li) => `<tr>
        <td>${escapeHtml(li.description)}</td>

  const laborHours = Number(quote.laborHours) || 0;
  const laborRate = Number(quote.laborRate) || 0;

  return `

          <h1>${escapeHtml(quote.title)}</h1>
        </div>

        ${site ? `<tr><td class="k">Site</td><td>${escapeHtml(site.number)}</td></tr>` : ""}
        ${cottage ? `<tr><td class="k">Cottage</td><td>${escapeHtml(cottage.name)}</td></tr>` : ""}

      ${quote.lineItems.length ? `
      <div class="label" style="margin-top:16px;">Line Items</div>
      <table class="wo-table" style="margin-top:6px;">
        <tr style="font-weight:600;">
          <td>Description</td><td style="text-align:right;">Qty</td><td style="text-align:right;">Unit</td><td style="text-align:right;">Line Total</td>

      <div style="display:flex; justify-content:flex-end;">

          ${laborHours ? `<tr><td style="padding:2px 16px 2px 0; color:#555;">Labor (${laborHours} hr &times; ${formatPrice(laborRate)})</td><td style="text-align:right;">${formatPrice(laborCost)}</td></tr>` : ""}
          ${quote.shopSuppliesPercent ? `<tr><td style="padding:2px 16px 2px 0; color:#555;">Shop supplies (${quote.shopSuppliesPercent}%)</td><td style="text-align:right;">${formatPrice(shopSupplies)}</td></tr>` : ""}
          ${serviceCall ? `<tr><td style="padding:2px 16px 2px 0; color:#555;">Service call</td><td style="text-align:right;">${formatPrice(serviceCall)}</td></tr>` : ""}
          <tr><td style="padding:2px 16px 2px 0; color:#555; border-top:1px solid #ccc;">Subtotal</td><td style="text-align:right; border-top:1px solid #ccc;">${formatPrice(subtotal)}</td></tr>
          <tr><td style="padding:2px 16px 2px 0; color:#555;">Tax (${taxRate}%)</td><td style="text-align:right;">${formatPrice(tax)}</td></tr>
          <tr style="font-weight:700;"><td style="padding:4px 16px 2px 0;">Total</td><td style="text-align:right;">${formatPrice(total)}</td></tr>
        </table>
      </div>
      <div class="sign">
        <div class="sign-line">Approved by (signature)</div>
        <div class="sign-line">Date</div>
      </div>
    </div>`;
}

function buildPrintDocument(bodyHtml) {
  return `<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Print</title>
<style>
  body { font-family: Georgia, serif; color: #111; margin: 0; }
  .wo { padding: 32px; page-break-after: always; }
  .wo:last-child { page-break-after: auto; }
  .wo-head { border-bottom: 2px solid #377249; padding-bottom: 10px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: flex-end; }
  .label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #555; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 2px 0 0; font-weight: 700; }
  .meta { font-size: 12px; text-align: right; color: #444; }
  .wo-table { width: 100%; font-size: 13px; margin-bottom: 18px; border-collapse: collapse; }
  .wo-table td { padding: 4px 8px 4px 0; }
  .wo-table td.k { color: #555; width: 120px; }
  .desc { font-size: 14px; line-height: 1.6; min-height: 60px; border-bottom: 1px solid #ccc; padding-bottom: 12px; white-space: pre-wrap; }
  .sign { margin-top: 40px; display: flex; justify-content: space-between; font-size: 12px; }
  .sign-line { width: 45%; border-top: 1px solid #333; padding-top: 4px; }
  .print-hint { padding: 12px 32px; font-family: Georgia, serif; font-size: 12px; color: #666; }
  @media print { .print-hint { display: none; } }
</style>
</head>
<body>
  <div class="print-hint">This file opened for printing. If the print dialog didn't appear automatically, press Ctrl+P (Cmd+P on Mac).</div>
  ${bodyHtml}
  <script>window.onload = function() { window.print(); };<\/script>
</body>
</html>`;
}

function downloadPrintableItems(items, buildItemHtml, filenameBase) {
  const body = items.map(buildItemHtml).join("\n");
  const html = buildPrintDocument(body);
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${filenameBase}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function downloadPrintable(list, db, filenameBase) {
  downloadPrintableItems(list, (wo) => buildWorkOrderHtml(wo, db), filenameBase);
}

function WorkOrdersView({ db, persist }) {
  const [modal, setModal] = useState(null);
  const [filter, setFilter] = useState("");
  const confirm = useConfirm();

  const save = (wo) => {
    const exists = db.workOrders.some((x) => x.id === wo.id);
    const workOrders = exists ? db.workOrders.map((x) => (x.id === wo.id ? wo : x)) : [...db.workOrders, wo];
    persist({ ...db, workOrders });
    setModal(null);
  };

  const remove = (id) => {
    persist({ ...db, workOrders: db.workOrders.filter((w) => w.id !== id) });
    confirm.clear();
  };

  const advance = (wo) => {
    const idx = STATUS.indexOf(wo.status);
    const nextStatus = STATUS[Math.min(idx + 1, STATUS.length - 1)];
    const updated = {
      ...wo,
      status: nextStatus,
      completedDate: nextStatus === "Completed" ? new Date().toISOString().slice(0, 10) : wo.completedDate,
    };
    persist({ ...db, workOrders: db.workOrders.map((w) => (w.id === wo.id ? updated : w)) });
  };

  const filtered = db.workOrders.filter((w) => {
    if (!filter) return true;
    const site = db.sites.find((s) => s.id === w.siteId);
    const cottage = db.cottages.find((c) => c.id === w.cottageId);
    const hay = `${w.title} ${w.description} ${site?.number || ""} ${cottage?.name || ""} ${w.assignedTo || ""}`.toLowerCase();
    return hay.includes(filter.toLowerCase());
  });

  return (
    <div>
      <div className="flex items-center justify-between mb-5 gap-3 flex-wrap">
        <div>
          <h2 className="font-serif text-2xl text-[#377249] font-semibold">Work Orders</h2>
          <p className="text-sm text-[#75716A]">The board — drag status forward as jobs move along.</p>
        </div>
        <div className="flex items-center gap-2">
          <input
            className={inputCls + " w-48"}
            placeholder="Search work orders…"
            value={filter}
            onChange={(e) => setFilter(e.target.value)}
          />
          {filtered.length > 0 && (
            <button
              onClick={() => downloadPrintable(filtered, db, filter ? "work-orders-filtered" : "work-orders-all")}
              className="px-3 py-2 rounded-md border border-[#377249]/30 text-[#377249] text-sm font-medium hover:bg-[#377249]/10 transition whitespace-nowrap"
            >
              Print {filter ? "results" : "all"}
            </button>
          )}
          <button
            onClick={() => setModal({ mode: "new" })}
            className="px-4 py-2 rounded-md bg-[#377249] text-[#F9F5EC] text-sm font-medium hover:bg-[#135C30] transition shadow-sm whitespace-nowrap"
          >
            + New Work Order
          </button>
        </div>
      </div>

      {db.workOrders.length === 0 ? (
        <EmptyState
          text="No work orders yet. Log your first job."
          action={
            <button onClick={() => setModal({ mode: "new" })} className="text-[#C1652F] text-sm font-medium underline">
              Add a work order
            </button>
          }
        />
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          {STATUS.map((status) => {
            const list = filtered.filter((w) => w.status === status);
            return (
              <div key={status}>
                <div className="flex items-center gap-2 mb-2 px-1">
                  <IconTag className="w-4 h-4 text-[#75716A]" />
                  <h3 className="text-xs uppercase tracking-wider font-semibold text-[#75716A]">{status}</h3>
                  <span className="text-[11px] text-[#9A968D] bg-[#F1EEE9] rounded-full px-1.5">{list.length}</span>
                </div>
                <div className="min-h-[60px]">
                  {list.length === 0 ? (
                    <div className="text-xs text-[#9A968D] italic px-1 py-3">Nothing here</div>
                  ) : (
                    list
                      .slice()
                      .sort((a, b) => (a.date < b.date ? 1 : -1))
                      .map((wo) => (
                        <WorkOrderTicket
                          key={wo.id}
                          wo={wo}
                          db={db}
                          onEdit={(w) => setModal({ mode: "edit", data: w })}
                          onDelete={(w) => confirm.ask(w.id)}
                          onAdvance={advance}
                          onPrint={(w) => downloadPrintable([w], db, `work-order-${w.title.replace(/[^a-z0-9]+/gi, "-").toLowerCase()}`)}
                        />
                      ))
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {modal && (
        <Modal title={modal.mode === "new" ? "New Work Order" : "Edit Work Order"} onClose={() => setModal(null)} wide>
          <WorkOrderForm initial={modal.data} sites={db.sites} cottages={db.cottages} onSave={save} onCancel={() => setModal(null)} />
        </Modal>
      )}

      {confirm.target && (
        <ConfirmDeleteModal
          label={db.workOrders.find((w) => w.id === confirm.target)?.title ?? "this work order"}
          onConfirm={() => remove(confirm.target)}
          onCancel={confirm.clear}
        />
      )}
    </div>
  );
}

function WorkOrderForm({ initial, sites, cottages, onSave, onCancel }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [description, setDescription] = useState(initial?.description || "");
  const [siteId, setSiteId] = useState(initial?.siteId || "");
  const [cottageId, setCottageId] = useState(initial?.cottageId || "");
  const [assignedTo, setAssignedTo] = useState(initial?.assignedTo || "");
  const [status, setStatus] = useState(initial?.status || "Open");
  const [date, setDate] = useState(initial?.date || new Date().toISOString().slice(0, 10));

  const submit = () => {
    if (!title.trim()) return;
    onSave({
      id: initial?.id || uid(),
      title: title.trim(),
      description: description.trim(),
      siteId: siteId || null,
      cottageId: cottageId || null,
      assignedTo: assignedTo.trim(),
      status,
      date,
      completedDate: initial?.completedDate || (status === "Completed" ? new Date().toISOString().slice(0, 10) : null),
    });
  };

  return (
    <div onKeyDown={(e) => { if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") submit(); }}>
      <div className="grid sm:grid-cols-2 gap-x-4">
        <Field label="Title">
          <input className={inputCls} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Fix leaking faucet" autoFocus />
        </Field>
        <Field label="Date">
          <input type="date" className={inputCls} value={date} onChange={(e) => setDate(e.target.value)} />
        </Field>
        <Field label="Site">
          <select className={inputCls} value={siteId} onChange={(e) => setSiteId(e.target.value)}>
            <option value="">None</option>
            {sites.map((s) => (
              <option key={s.id} value={s.id}>Site {s.number}</option>
            ))}
          </select>
        </Field>
        <Field label="Cottage">
          <select className={inputCls} value={cottageId} onChange={(e) => setCottageId(e.target.value)}>
            <option value="">None</option>
            {cottages.map((c) => (
              <option key={c.id} value={c.id}>{c.name}</option>
            ))}
          </select>
        </Field>
        <Field label="Assigned To">
          <input className={inputCls} value={assignedTo} onChange={(e) => setAssignedTo(e.target.value)} placeholder="e.g. Dave" />
        </Field>
        <Field label="Status">
          <select className={inputCls} value={status} onChange={(e) => setStatus(e.target.value)}>
            {STATUS.map((s) => (
              <option key={s} value={s}>{s}</option>
            ))}
          </select>
        </Field>
      </div>
      <Field label="Description">
        <textarea className={inputCls} rows={3} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="What needs doing, parts needed, etc." />
      </Field>
      <div className="flex justify-end gap-2 mt-4">
        <button type="button" onClick={onCancel} className="px-4 py-2 text-sm text-[#75716A] hover:bg-[#F1EEE9] rounded-md">Cancel</button>
        <button type="button" onClick={submit} className="px-4 py-2 text-sm bg-[#377249] text-[#F9F5EC] rounded-md hover:bg-[#135C30] font-medium">Save Work Order</button>
      </div>
    </div>
  );
}

            <button
              key={t.key}
              onClick={() => setTab(t.key)}
              className={`flex items-center gap-2.5 px-3 py-2.5 rounded-[9px] text-[13.5px] font-semibold text-left transition ${
                tab === t.key ? "bg-[#DDF1E1] text-[#28633C]" : "text-[#4B4740] hover:bg-[#F1EEE9]"
              }`}
            >
              <span className={`w-[7px] h-[7px] rounded-[2px] flex-shrink-0 ${tab === t.key ? "bg-[#28633C]" : "bg-[#E2DED5]"}`} />
              {t.label}
            </button>
          ))}
        </nav>

        <div className="px-3 py-3 border-t border-[#E2DED5] mt-1.5 flex items-center justify-between gap-2">
          <div className="text-[11px] text-[#75716A] font-medium">
            {openCount} open work order{openCount === 1 ? "" : "s"}
          </div>
          <button
            onClick={() => firebase.auth().signOut()}
            className="text-[11px] text-[#75716A] hover:text-[#1E1A13] font-medium underline whitespace-nowrap"
          >
            Sign out
          </button>
        </div>
      </aside>

      <div className="flex-1 min-w-0 px-6 sm:px-8 py-6">
        {error && (
          <div className="mb-4 flex items-center justify-between gap-3 text-xs text-[#a8532a] bg-[#F5E3D9] border border-[#e0bfa6] rounded-md px-3 py-2">
            <span>{error}</span>
            <button onClick={retry} className="px-2 py-1 rounded bg-white/60 hover:bg-white font-medium whitespace-nowrap">
              Retry
            </button>
          </div>
        )}

        <main>
          {tab === "workorders" && <WorkOrdersView db={db} persist={persist} />}
          {tab === "sites" && <SitesView db={db} persist={persist} />}
          {tab === "cottages" && <CottagesView db={db} persist={persist} />}
          {tab === "customers" && <CustomersView db={db} persist={persist} />}
          {tab === "parts" && <PartsView db={db} persist={persist} />}
          {tab === "quotes" && <QuotesView db={db} persist={persist} />}
        </main>
      </div>
    </div>
  );
}

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setError(null);
    if (!email.trim() || !password) {
      setError("Enter your email and password.");
      return;
    }
    setLoading(true);
    try {
      await firebase.auth().signInWithEmailAndPassword(email.trim(), password);
    } catch (e) {
      setError(e?.message || "Couldn't sign in. Check your email and password.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div
      className="min-h-screen flex items-center justify-center bg-[#F9F5EC] px-4"
      onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
    >
      <div className="w-full max-w-sm bg-[#FFFDFA] border border-[#E2DED5] rounded-[14px] p-7 shadow-sm">
        <div className="flex items-center gap-2.5 mb-6">
          <div className="w-8 h-8 rounded-[9px] bg-[#377249] flex items-center justify-center text-white flex-shrink-0">
            <IconTag className="w-4 h-4" />
          </div>
          <div className="font-serif text-[15px] text-[#1E1A13]">Campground Maintenance</div>
        </div>
        <h1 className="text-lg font-bold text-[#1E1A13] mb-1">Sign in</h1>
        <p className="text-sm text-[#75716A] mb-5">Use the email and password your manager set up for you.</p>
        <Field label="Email">
          <input
            type="email"
            className={inputCls}
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            autoFocus
            autoComplete="username"
          />
        </Field>
        <Field label="Password">
          <input
            type="password"
            className={inputCls}
            value={password}
            onChange={(e) => setPassword(e.target.value)}
            autoComplete="current-password"
          />
        </Field>
        {error && (
          <p className="text-xs text-[#a8532a] bg-[#F5E3D9] border border-[#e0bfa6] rounded-md px-3 py-2 mb-3">{error}</p>
        )}
        <button
          type="button"
          onClick={submit}
          disabled={loading}
          className="w-full px-4 py-2.5 text-sm bg-[#377249] text-white rounded-[9px] hover:bg-[#135C30] font-semibold disabled:opacity-60"
        >
          {loading ? "Signing in…" : "Sign In"}
        </button>
      </div>
    </div>
  );
}

function AuthGate() {
  const [user, setUser] = useState(undefined); // undefined = checking, null = signed out, object = signed in

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((u) => setUser(u));
    return () => unsub();
  }, []);

  if (user === undefined) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-[#F9F5EC]">
        <p className="text-[#75716A] text-sm">Checking sign-in…</p>
      </div>
    );
  }

  if (!user) {
    return <LoginScreen />;
  }

  return <AppContent />;
}

function App() {
  return (
    <ErrorBoundary>
      <AuthGate />
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
