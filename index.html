function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function isOverdue(wo) {
  return wo.status !== "Completed" && wo.date && wo.date < todayISO();
}

// The signed-in user's email, made available to any component without prop-drilling.
const CurrentUserContext = React.createContext(null);
function useCurrentActor() {
  const email = React.useContext(CurrentUserContext);
  return email || "Unknown";
}

// Prepends a log entry and caps the log at 200 entries so it can't grow forever.
function addLog(db, actor, summary) {
  const entry = { id: uid(), ts: new Date().toISOString(), actor, summary };
  return [entry, ...(db.activityLog || [])].slice(0, 200);
}

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.round(hrs / 24);
  return `${days}d ago`;
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null, resetting: false };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  handleReset = async () => {
    this.setState({ resetting: true });
    try {
      await DOC_REF.set(emptyDb());
    } catch (e) {
      // even if this fails, clearing local state below still recovers the UI
    }
    this.setState({ error: null, resetting: false });
  };
  render() {
    if (this.state.error) {
      return (
        <div className="min-h-screen flex items-center justify-center bg-[#F9F5EC] p-6">
          <div className="max-w-sm text-center">
            <p className="text-[#a8532a] font-semibold mb-2">Something went wrong loading your records.</p>
            <p className="text-xs text-[#75716A] mb-4">
              This can happen if the shared data got into a bad state, or if the Firebase config
              above hasn't been filled in yet. Resetting will clear all saved sites, cottages,
              customers, and work orders and start fresh.
            </p>
            <button
              onClick={this.handleReset}
              disabled={this.state.resetting}
              className="px-4 py-2 rounded-md bg-[#377249] text-[#F9F5EC] text-sm font-medium hover:bg-[#135C30] disabled:opacity-60"
            >
              {this.state.resetting ? "Resetting…" : "Reset all data"}
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function useDb() {
  const [db, setDb] = useState(null);
  const [loading, setLoading] = useState(true);
  const [connectionError, setConnectionError] = useState(null);
  const [saveError, setSaveError] = useState(null);
  const lastAttempt = useRef(null);

  useEffect(() => {
    const unsub = DOC_REF.onSnapshot(
      (snap) => {
        const data = snap.exists ? snap.data() : null;
        setDb({ ...emptyDb(), ...(data && typeof data === "object" ? data : {}) });
        setLoading(false);
        setConnectionError(null);
      },
      (err) => {
        setConnectionError(`Couldn't connect to the shared database${err?.message ? `: ${err.message}` : ""}.`);
        setDb((cur) => cur || emptyDb());
        setLoading(false);
      }
    );
    return () => unsub();
  }, []);

  const persist = useCallback(async (next) => {
    setDb(next); // update the UI immediately
    lastAttempt.current = next;
    try {
      await DOC_REF.set(next);
      setSaveError(null);
    } catch (e) {
      setSaveError(`Couldn't save that change${e?.message ? `: ${e.message}` : ""}. Try again.`);
    }
  }, []);

  const error = saveError || connectionError;

  const retry = useCallback(() => {
    if (lastAttempt.current) persist(lastAttempt.current);
  }, [persist]);

  return { db, loading, error, persist, retry };
}

// ---------- Sites ----------

function SitesView({ db, persist }) {
  const [modal, setModal] = useState(null);
  const [filter, setFilter] = useState("");
  const [detailId, setDetailId] = useState(null);
  const [bulkOpen, setBulkOpen] = useState(false);
  const confirm = useConfirm();
  const actor = useCurrentActor();

  const save = (site) => {
    const exists = db.sites.some((s) => s.id === site.id);
    const sites = exists ? db.sites.map((s) => (s.id === site.id ? site : s)) : [...db.sites, site];
    const activityLog = addLog(db, actor, exists ? `Updated site ${site.number}` : `Added site ${site.number}`);
    persist({ ...db, sites, activityLog });
    setModal(null);
  };

  const bulkAdd = (numbers) => {
    const existingNumbers = new Set(db.sites.map((s) => s.number.trim().toLowerCase()));
    const newSites = [];
    numbers.forEach((n) => {
      const trimmed = n.trim();
      if (!trimmed) return;
      if (existingNumbers.has(trimmed.toLowerCase())) return;
      existingNumbers.add(trimmed.toLowerCase());
      newSites.push({ id: uid(), number: trimmed, section: "", hookups: "", notes: "" });
    });
    if (newSites.length === 0) {
      setBulkOpen(false);
      return;
    }
    const activityLog = addLog(db, actor, `Bulk-added ${newSites.length} site${newSites.length === 1 ? "" : "s"}`);
    persist({ ...db, sites: [...db.sites, ...newSites], activityLog });
    setBulkOpen(false);
  };

  const remove = (id) => {
    const site = db.sites.find((s) => s.id === id);
    const activityLog = addLog(db, actor, `Removed site ${site?.number ?? ""}`);
    persist({ ...db, sites: db.sites.filter((s) => s.id !== id), activityLog });
    confirm.clear();
  };

  const filtered = db.sites.filter((s) => {
    if (!filter) return true;
    const hay = `${s.number} ${s.section || ""} ${s.hookups || ""} ${s.notes || ""}`.toLowerCase();
    return hay.includes(filter.toLowerCase());
  });

  return (
    <div>
      <div className="flex items-center justify-between mb-5 gap-3 flex-wrap">
        <div>
          <h2 className="font-serif text-2xl text-[#377249] font-semibold">Sites</h2>
          <p className="text-sm text-[#75716A]">Site numbers, sections, and hookup notes.</p>
        </div>
        <div className="flex items-center gap-2">
          <input
            className={inputCls + " w-48"}
            placeholder="Search sites…"
            value={filter}
            onChange={(e) => setFilter(e.target.value)}
          />
          <button
            onClick={() => setBulkOpen(true)}
            className="px-3 py-2 rounded-md border border-[#377249]/30 text-[#377249] text-sm font-medium hover:bg-[#377249]/10 transition whitespace-nowrap"
          >
            Bulk Add
          </button>
          <button
            onClick={() => setModal({ mode: "new" })}
            className="px-4 py-2 rounded-md bg-[#377249] text-[#F9F5EC] text-sm font-medium hover:bg-[#135C30] transition shadow-sm whitespace-nowrap"
          >
            + New Site
          </button>
        </div>
      </div>

      {db.sites.length === 0 ? (
        <EmptyState
          text="No sites yet. Add your first site number to get started."
          action={
            <button onClick={() => setModal({ mode: "new" })} className="text-[#C1652F] text-sm font-medium underline">
              Add a site
            </button>
          }
        />
      ) : filtered.length === 0 ? (
        <EmptyState text="No sites match your search." />
      ) : (
        <div className="overflow-x-auto rounded-lg border border-[#E2DED5]">
          <table className="w-full text-sm">
            <thead>
              <tr className="bg-[#F1EEE9] text-left text-[#75716A] uppercase text-[11px] tracking-wider">
                <th className="px-4 py-2.5">Site #</th>
                <th className="px-4 py-2.5">Section</th>
                <th className="px-4 py-2.5">Hookups</th>
                <th className="px-4 py-2.5">Notes</th>
                <th className="px-4 py-2.5 w-32"></th>
              </tr>
            </thead>
            <tbody>
              {filtered
                .slice()
                .sort((a, b) => a.number.localeCompare(b.number, undefined, { numeric: true }))
                .map((s) => (
                  <tr key={s.id} className="border-t border-[#EEEBE5] hover:bg-[#FFFDFA]">
                    <td className="px-4 py-2.5 font-semibold text-[#1E1A13]">
                      <button className="hover:underline" onClick={() => setDetailId(s.id)}>{s.number}</button>
                    </td>
                    <td className="px-4 py-2.5 text-[#4B4740]">{s.section || "—"}</td>
                    <td className="px-4 py-2.5 text-[#4B4740]">{s.hookups || "—"}</td>
                    <td className="px-4 py-2.5 text-[#4B4740] max-w-xs truncate">{s.notes || "—"}</td>
                    <td className="px-4 py-2.5 text-right">
                      <div className="flex gap-3 justify-end text-xs">
                        <button className="text-[#377249] hover:underline" onClick={() => setDetailId(s.id)}>
                          View
                        </button>
                        <button className="text-[#377249] hover:underline" onClick={() => setModal({ mode: "edit", data: s })}>
                          Edit
                        </button>
                        <button className="text-[#a8532a] hover:underline" onClick={() => confirm.ask(s.id)}>
                          Delete
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
            </tbody>
          </table>
        </div>
      )}

      {modal && (
        <Modal title={modal.mode === "new" ? "New Site" : "Edit Site"} onClose={() => setModal(null)}>
          <SiteForm initial={modal.data} onSave={save} onCancel={() => setModal(null)} />
        </Modal>
      )}

      {bulkOpen && (
        <Modal title="Bulk Add Sites" onClose={() => setBulkOpen(false)}>
          <BulkAddSitesForm onSave={bulkAdd} onCancel={() => setBulkOpen(false)} />
        </Modal>
      )}

      {detailId && (
        <SiteDetailModal
          site={db.sites.find((s) => s.id === detailId)}
          db={db}
          onClose={() => setDetailId(null)}
          onEdit={(s) => {
            setDetailId(null);
            setModal({ mode: "edit", data: s });
          }}
        />
      )}

      {confirm.target && (
        <ConfirmDeleteModal
          label={`site ${db.sites.find((s) => s.id === confirm.target)?.number ?? ""}`}
          onConfirm={() => remove(confirm.target)}
          onCancel={confirm.clear}
        />
      )}
    </div>
  );
}

function BulkAddSitesForm({ onSave, onCancel }) {
  const [text, setText] = useState("");

  const numbers = text
    .split(/[\n,]/)
    .map((n) => n.trim())
    .filter(Boolean);

  const submit = () => {
    if (numbers.length === 0) return;
    onSave(numbers);
  };

  return (
    <div>
      <p className="text-sm text-[#4B4740] mb-3">
        Paste your site numbers below — one per line, or separated by commas. You can fill in section, hookups,
        and notes for each afterward from the Sites list.
      </p>
      <Field label="Site Numbers">
        <textarea
          className={inputCls}
          rows={8}
          value={text}
          onChange={(e) => setText(e.target.value)}
          placeholder={"e.g.\n12\n13\n14\nor: 12, 13, 14"}
          autoFocus
        />
      </Field>
      <p className="text-xs text-[#75716A] mb-3">
        {numbers.length} site{numbers.length === 1 ? "" : "s"} ready to add
        {numbers.length > 0 ? ` (${numbers.slice(0, 8).join(", ")}${numbers.length > 8 ? "…" : ""})` : ""}
      </p>
      <div className="flex justify-end gap-2">
        <button type="button" onClick={onCancel} className="px-4 py-2 text-sm text-[#75716A] hover:bg-[#F1EEE9] rounded-md">Cancel</button>
        <button
          type="button"
          onClick={submit}
          disabled={numbers.length === 0}
          className="px-4 py-2 text-sm bg-[#377249] text-[#F9F5EC] rounded-md hover:bg-[#135C30] font-medium disabled:opacity-40"
        >
          Add {numbers.length || ""} Site{numbers.length === 1 ? "" : "s"}

      </div>
    </div>
  );
}

  return (
    <div className="mb-4">
      <h4 className="text-[11px] uppercase tracking-wider text-[#75716A] font-semibold mb-1.5">{title}</h4>
      {hasContent ? <div>{children}</div> : <p className="text-xs text-[#9A968D] italic">{empty}</p>}
    </div>
  );
}

function SiteForm({ initial, onSave, onCancel }) {
  const [number, setNumber] = useState(initial?.number || "");
  const [section, setSection] = useState(initial?.section || "");
  const [hookups, setHookups] = useState(initial?.hookups || "");
  const [notes, setNotes] = useState(initial?.notes || "");

  const submit = () => {
    if (!number.trim()) return;
    onSave({ id: initial?.id || uid(), number: number.trim(), section: section.trim(), hookups: hookups.trim(), notes: notes.trim() });
  };

  return (
    <div onKeyDown={(e) => { if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") submit(); }}>
      <Field label="Site Number">
        <input className={inputCls} value={number} onChange={(e) => setNumber(e.target.value)} placeholder="e.g. 24" autoFocus />
      </Field>
      <Field label="Section / Loop">
        <input className={inputCls} value={section} onChange={(e) => setSection(e.target.value)} placeholder="e.g. North Loop" />

  Tan: "#C6A97A", Teal: "#3E7A72", Orange: "#C1652F", Purple: "#6E5178",
};

function colorDot(name) {
  const key = Object.keys(COLOR_SWATCH).find((k) => k.toLowerCase() === (name || "").trim().toLowerCase());
  return key ? COLOR_SWATCH[key] : "#B7AC96";
}

function formatPrice(value) {
  const n = Number(value);
  return Number.isFinite(n) ? `$${n.toFixed(2)}` : "—";
}

function TaxRateControl({ db, persist }) {
  const taxRate = db.settings?.taxRate ?? 13;
  const [value, setValue] = useState(String(taxRate));

  useEffect(() => {
    setValue(String(db.settings?.taxRate ?? 13));
  }, [db.settings?.taxRate]);

  const commit = () => {
    const n = Number(value);
    const rate = Number.isFinite(n) && n >= 0 ? n : 0;
    persist({ ...db, settings: { ...(db.settings || {}), taxRate: rate } });
  };

  return (
    <div className="flex items-center gap-1.5 text-sm text-[#75716A]">
      <span className="whitespace-nowrap">Tax rate</span>
      <input
        type="number"
        min="0"
        step="0.1"
        value={value}
        onChange={(e) => setValue(e.target.value)}
        onBlur={commit}
        onKeyDown={(e) => {
          if (e.key === "Enter") {
            commit();
            e.currentTarget.blur();
          }
        }}
        className="w-16 rounded-md border border-[#E2DED5] bg-[#FFFDFA] px-2 py-1 text-sm text-[#1E1A13] focus:outline-none focus:ring-2 focus:ring-[#C1652F]/50 focus:border-[#C1652F]"
      />
      <span>%</span>
    </div>
  );
}

        </div>
      )}

      {db.parts.length === 0 ? (
        <EmptyState
          text="No parts yet. Add your first part to start tracking stock."
          action={
            <button onClick={() => setModal({ mode: "new" })} className="text-[#C1652F] text-sm font-medium underline">
              Add a part
            </button>
          }
        />
      ) : filtered.length === 0 ? (
        <EmptyState text="No parts match your search." />
      ) : (
        <div className="overflow-x-auto rounded-lg border border-[#E2DED5]">
          <table className="w-full text-sm">
            <thead>
              <tr className="bg-[#F1EEE9] text-left text-[#75716A] uppercase text-[11px] tracking-wider">
                <th className="px-4 py-2.5">Name</th>
                <th className="px-4 py-2.5">Price</th>
                <th className="px-4 py-2.5">Price (incl. tax)</th>
                <th className="px-4 py-2.5">Qty in Stock</th>
                <th className="px-4 py-2.5 w-32"></th>

              {filtered
                .slice()
                .sort((a, b) => a.name.localeCompare(b.name))

                  const lowStock = Number(p.quantity) <= (Number(p.reorderThreshold) || 2);
                  const priceWithTax = Number(p.price) * (1 + taxRate / 100);
                  return (
                    <tr key={p.id} className="border-t border-[#EEEBE5] hover:bg-[#FFFDFA]">
                      <td className="px-4 py-2.5 font-semibold text-[#1E1A13]">{p.name}</td>

      )}

      {confirm.target && (
        <ConfirmDeleteModal
          label={db.parts.find((p) => p.id === confirm.target)?.name ?? "this part"}
          onConfirm={() => remove(confirm.target)}
          onCancel={confirm.clear}
        />
      )}
    </div>
  );
}

function PartForm({ initial, onSave, onCancel }) {
  const [name, setName] = useState(initial?.name || "");
  const [price, setPrice] = useState(initial?.price ?? "");
  const [quantity, setQuantity] = useState(initial?.quantity ?? "");
  const [reorderThreshold, setReorderThreshold] = useState(initial?.reorderThreshold ?? 2);

  const submit = () => {
    if (!name.trim()) return;
    onSave({
      id: initial?.id || uid(),
      name: name.trim(),
      price: price === "" ? 0 : Number(price),
      quantity: quantity === "" ? 0 : Number(quantity),
      reorderThreshold: reorderThreshold === "" ? 2 : Number(reorderThreshold),
    });
  };

  return (
    <div onKeyDown={(e) => { if (e.key === "Enter") submit(); }}>
      <Field label="Part Name">
        <input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Water heater element" autoFocus />
      </Field>
      <Field label="Price">
        <input
          type="number"
          step="0.01"
          min="0"
          className={inputCls}
          value={price}
          onChange={(e) => setPrice(e.target.value)}
          placeholder="0.00"
        />
      </Field>
      <Field label="Quantity in Stock">
        <input
          type="number"
          step="1"
          min="0"
          className={inputCls}
          value={quantity}
          onChange={(e) => setQuantity(e.target.value)}
          placeholder="0"
        />
      </Field>
      <Field label="Reorder Threshold">
        <input
          type="number"
          step="1"
          min="0"
          className={inputCls}
          value={reorderThreshold}
          onChange={(e) => setReorderThreshold(e.target.value)}
          placeholder="2"
        />
      </Field>
      <div className="flex justify-end gap-2 mt-4">
        <button type="button" onClick={onCancel} className="px-4 py-2 text-sm text-[#75716A] hover:bg-[#F1EEE9] rounded-md">Cancel</button>
        <button type="button" onClick={submit} className="px-4 py-2 text-sm bg-[#377249] text-[#F9F5EC] rounded-md hover:bg-[#135C30] font-medium">Save Part</button>
      </div>
    </div>
  );
}

const QUOTE_STATUS = ["Draft", "Sent", "Accepted", "Declined"];

const QUOTE_STATUS_STYLES = {
  Draft: "bg-[#F1EEE9] text-[#75716A]",
  Sent: "bg-[#DCEBE8] text-[#3E7A72]",
  Accepted: "bg-[#377249]/10 text-[#377249]",
  Declined: "bg-[#F5E3D9] text-[#a8532a]",
};

function QuotesView({ db, persist, onGoToWorkOrders }) {
  const [modal, setModal] = useState(null);
  const [filter, setFilter] = useState("");
  const confirm = useConfirm();
  const actor = useCurrentActor();
  const taxRate = db.settings?.taxRate ?? 13;

  const save = (quote) => {
    const exists = db.quotes.some((q) => q.id === quote.id);
    const quotes = exists ? db.quotes.map((q) => (q.id === quote.id ? quote : q)) : [...db.quotes, quote];
    const activityLog = addLog(db, actor, exists ? `Updated quote "${quote.title}"` : `Created quote "${quote.title}"`);
    persist({ ...db, quotes, activityLog });
    setModal(null);
  };

  const remove = (id) => {
    const quote = db.quotes.find((q) => q.id === id);
    const activityLog = addLog(db, actor, `Removed quote "${quote?.title ?? ""}"`);
    persist({ ...db, quotes: db.quotes.filter((q) => q.id !== id), activityLog });
    confirm.clear();
  };

  const updateStatus = (quote, status) => {
    const activityLog = addLog(db, actor, `Quote "${quote.title}" marked ${status}`);
    persist({ ...db, quotes: db.quotes.map((q) => (q.id === quote.id ? { ...q, status } : q)), activityLog });
  };

  const convertToWorkOrder = (quote) => {
    const newId = uid();
    const lineItemNotes = quote.lineItems.length
      ? "Line items:\n" + quote.lineItems.map((li) => `- ${li.description} (x${li.quantity})`).join("\n")
      : "";
    const newWorkOrder = {
      id: newId,
      title: quote.title,
      description: [quote.notes, lineItemNotes].filter(Boolean).join("\n\n"),
      siteId: quote.siteId || null,
      cottageId: quote.cottageId || null,
      assignedTo: "",
      status: "Open",
      priority: "Medium",
      date: new Date().toISOString().slice(0, 10),
      completedDate: null,
      partsUsed: quote.lineItems.filter((li) => li.partId).map((li) => ({ partId: li.partId, quantity: li.quantity })),
    };
    const quotes = db.quotes.map((q) => (q.id === quote.id ? { ...q, workOrderId: newId } : q));
    const activityLog = addLog(db, actor, `Converted quote "${quote.title}" to a work order`);
    persist({ ...db, workOrders: [...db.workOrders, newWorkOrder], quotes, activityLog });
    if (onGoToWorkOrders) onGoToWorkOrders();
  };

  const filtered = db.quotes.filter((q) => {
    if (!filter) return true;
    const site = db.sites.find((s) => s.id === q.siteId);
    const cottage = db.cottages.find((c) => c.id === q.cottageId);
    const customer = db.customers.find((c) => c.id === q.customerId);
    const hay = `${q.title} ${site?.number || ""} ${cottage?.name || ""} ${customer?.name || ""}`.toLowerCase();
    return hay.includes(filter.toLowerCase());
  });

  return (
    <div>
      <div className="flex items-center justify-between mb-5 gap-3 flex-wrap">
        <div>
          <h2 className="font-serif text-2xl text-[#377249] font-semibold">Quotes</h2>
          <p className="text-sm text-[#75716A]">Job estimates you can link to a site, cottage, or customer.</p>
        </div>
        <div className="flex items-center gap-2">
          <input
            className={inputCls + " w-44"}
            placeholder="Search quotes…"
            value={filter}
            onChange={(e) => setFilter(e.target.value)}
          />
          <button
            onClick={() => setModal({ mode: "new" })}
            className="px-4 py-2 rounded-md bg-[#377249] text-[#F9F5EC] text-sm font-medium hover:bg-[#135C30] transition shadow-sm whitespace-nowrap"
          >
            + New Quote
          </button>
        </div>
      </div>

      {db.quotes.length === 0 ? (
        <EmptyState
          text="No quotes yet."
          action={
            <button onClick={() => setModal({ mode: "new" })} className="text-[#C1652F] text-sm font-medium underline">
              Add a quote
            </button>
          }
        />
      ) : filtered.length === 0 ? (
        <EmptyState text="No quotes match your search." />
      ) : (
        <div className="overflow-x-auto rounded-lg border border-[#E2DED5]">
          <table className="w-full text-sm">
            <thead>
              <tr className="bg-[#F1EEE9] text-left text-[#75716A] uppercase text-[11px] tracking-wider">
                <th className="px-4 py-2.5">Job</th>
                <th className="px-4 py-2.5">Linked To</th>
                <th className="px-4 py-2.5">Date</th>
                <th className="px-4 py-2.5">Status</th>
                <th className="px-4 py-2.5">Total (incl. tax)</th>
                <th className="px-4 py-2.5 w-52"></th>
              </tr>
            </thead>
            <tbody>
              {filtered
                .slice()
                .sort((a, b) => (a.date < b.date ? 1 : -1))
                .map((q) => {
                  const site = db.sites.find((s) => s.id === q.siteId);
                  const cottage = db.cottages.find((c) => c.id === q.cottageId);
                  const customer = db.customers.find((c) => c.id === q.customerId);
                  const linked =
                    [customer?.name, site ? `Site ${site.number}` : null, cottage?.name].filter(Boolean).join(" · ") || "—";
                  const { total } = computeQuoteTotals(q, taxRate);
                  return (
                    <tr key={q.id} className="border-t border-[#EEEBE5] hover:bg-[#FFFDFA]">
                      <td className="px-4 py-2.5 font-semibold text-[#1E1A13]">{q.title}</td>
                      <td className="px-4 py-2.5 text-[#4B4740]">{linked}</td>
                      <td className="px-4 py-2.5 text-[#4B4740]">{q.date}</td>
                      <td className="px-4 py-2.5">
                        <select
                          value={q.status}
                          onChange={(e) => updateStatus(q, e.target.value)}
                          className={`text-xs rounded-full px-2 py-1 border-0 font-medium focus:outline-none focus:ring-2 focus:ring-[#C1652F]/40 ${
                            QUOTE_STATUS_STYLES[q.status] || ""
                          }`}
                        >
                          {QUOTE_STATUS.map((s) => (
                            <option key={s} value={s}>{s}</option>
                          ))}
                        </select>
                      </td>
                      <td className="px-4 py-2.5 text-[#4B4740]">{formatPrice(total)}</td>
                      <td className="px-4 py-2.5 text-right">
                        <div className="flex gap-3 justify-end items-center text-xs flex-wrap">
                          <button className="text-[#377249] hover:underline" onClick={() => setModal({ mode: "edit", data: q })}>
                            Edit
                          </button>
                          <button
                            className="text-[#75716A] hover:underline"
                            onClick={() =>
                              downloadPrintableItems(
                                [q],
                                (quote) => buildQuoteHtml(quote, db, taxRate),
                                `quote-${q.title.replace(/[^a-z0-9]+/gi, "-").toLowerCase()}`
                              )
                            }
                          >
                            Print
                          </button>
                          {q.status === "Accepted" && !q.workOrderId && (
                            <button className="text-[#377249] hover:underline font-medium" onClick={() => convertToWorkOrder(q)}>
                              Convert
                            </button>
                          )}
                          {q.workOrderId && <span className="text-[10px] text-[#75716A] italic">Converted</span>}
                          <button className="text-[#a8532a] hover:underline" onClick={() => confirm.ask(q.id)}>
                            Delete
                          </button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
            </tbody>
          </table>
        </div>
      )}

      {modal && (
        <Modal title={modal.mode === "new" ? "New Quote" : "Edit Quote"} onClose={() => setModal(null)} wide>
          <QuoteForm
            initial={modal.data}
            sites={db.sites}
            cottages={db.cottages}
            customers={db.customers}
            parts={db.parts}
            taxRate={taxRate}
            defaultShopSuppliesPercent={db.settings?.shopSuppliesPercent ?? 5}
            onSave={save}
            onCancel={() => setModal(null)}
          />
        </Modal>
      )}

      {confirm.target && (
        <ConfirmDeleteModal
          label={db.quotes.find((q) => q.id === confirm.target)?.title ?? "this quote"}
          onConfirm={() => remove(confirm.target)}
          onCancel={confirm.clear}
        />
      )}
    </div>
  );
}

function QuoteForm({ initial, sites, cottages, customers, parts, taxRate, defaultShopSuppliesPercent, onSave, onCancel }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [date, setDate] = useState(initial?.date || new Date().toISOString().slice(0, 10));
  const [status, setStatus] = useState(initial?.status || "Draft");
  const [siteId, setSiteId] = useState(initial?.siteId || "");
  const [cottageId, setCottageId] = useState(initial?.cottageId || "");
  const [customerId, setCustomerId] = useState(initial?.customerId || "");
  const [notes, setNotes] = useState(initial?.notes || "");
  const [lineItems, setLineItems] = useState(
    initial?.lineItems?.length ? initial.lineItems : [{ id: uid(), description: "", quantity: 1, unitPrice: 0 }]
  );
  const [partToAdd, setPartToAdd] = useState("");
  const [laborHours, setLaborHours] = useState(initial?.laborHours ?? "");
  const [laborRateType, setLaborRateType] = useState(
    RATE_OPTIONS.find((r) => r.rate === initial?.laborRate)?.label || RATE_OPTIONS[1].label
  );
  const [shopSuppliesPercent, setShopSuppliesPercent] = useState(initial?.shopSuppliesPercent ?? defaultShopSuppliesPercent ?? 5);
  const [serviceCall, setServiceCall] = useState(initial?.serviceCall ?? "");

  const laborRate = RATE_OPTIONS.find((r) => r.label === laborRateType)?.rate ?? RATE_OPTIONS[1].rate;

  const updateLine = (id, field, value) => {
    setLineItems((items) => items.map((li) => (li.id === id ? { ...li, [field]: value } : li)));
  };

  const removeLine = (id) => {
    setLineItems((items) => (items.length > 1 ? items.filter((li) => li.id !== id) : items));
  };

  const addBlankLine = () => {
    setLineItems((items) => [...items, { id: uid(), description: "", quantity: 1, unitPrice: 0 }]);
  };

  const addPartLine = () => {
    const part = parts.find((p) => p.id === partToAdd);
    if (!part) return;
    setLineItems((items) => [...items, { id: uid(), description: part.name, quantity: 1, unitPrice: Number(part.price) || 0, partId: part.id }]);
    setPartToAdd("");
  };

  const lineItemsSubtotal = lineItems.reduce((sum, li) => sum + (Number(li.quantity) || 0) * (Number(li.unitPrice) || 0), 0);
  const laborCost = (Number(laborHours) || 0) * laborRate;
  const shopSupplies = (lineItemsSubtotal + laborCost) * ((Number(shopSuppliesPercent) || 0) / 100);
  const serviceCallAmt = Number(serviceCall) || 0;
  const subtotal = lineItemsSubtotal + laborCost + shopSupplies + serviceCallAmt;
  const tax = subtotal * (taxRate / 100);
  const total = subtotal + tax;

  const submit = () => {
    if (!title.trim()) return;
    const cleanItems = lineItems
      .filter((li) => li.description.trim())
      .map((li) => ({
        id: li.id,
        description: li.description.trim(),
        quantity: Number(li.quantity) || 0,
        unitPrice: Number(li.unitPrice) || 0,
        ...(li.partId ? { partId: li.partId } : {}),
      }));
    onSave({
      id: initial?.id || uid(),
      title: title.trim(),
      date,
      status,
      siteId: siteId || null,
      cottageId: cottageId || null,
      customerId: customerId || null,
      notes: notes.trim(),
      lineItems: cleanItems,
      laborHours: Number(laborHours) || 0,
      laborRate,
      laborRateType,
      shopSuppliesPercent: Number(shopSuppliesPercent) || 0,
      serviceCall: Number(serviceCall) || 0,
    });
  };

  return (
    <div onKeyDown={(e) => { if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") submit(); }}>
      <div className="grid sm:grid-cols-2 gap-x-4">
        <Field label="Job Title">
          <input className={inputCls} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Deck repair estimate" autoFocus />
        </Field>
        <Field label="Date">
          <input type="date" className={inputCls} value={date} onChange={(e) => setDate(e.target.value)} />
        </Field>
        <Field label="Status">
          <select className={inputCls} value={status} onChange={(e) => setStatus(e.target.value)}>
            {QUOTE_STATUS.map((s) => (
              <option key={s} value={s}>{s}</option>
            ))}
          </select>
        </Field>
        <Field label="Customer">
          <select className={inputCls} value={customerId} onChange={(e) => setCustomerId(e.target.value)}>
            <option value="">None</option>
            {customers.map((c) => (
              <option key={c.id} value={c.id}>{c.name}</option>
            ))}
          </select>
        </Field>
        <Field label="Site">
          <select className={inputCls} value={siteId} onChange={(e) => setSiteId(e.target.value)}>
            <option value="">None</option>
            {sites.map((s) => (
              <option key={s.id} value={s.id}>Site {s.number}</option>
            ))}
          </select>
        </Field>
        <Field label="Cottage">
          <select className={inputCls} value={cottageId} onChange={(e) => setCottageId(e.target.value)}>
            <option value="">None</option>
            {cottages.map((c) => (
              <option key={c.id} value={c.id}>{c.name}</option>
            ))}
          </select>
        </Field>
      </div>

      <Field label="Notes">
        <textarea className={inputCls} rows={2} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Job details, scope of work, etc." />
      </Field>

      <div className="mt-4">
        <span className="block text-[11px] uppercase tracking-wider text-[#75716A] mb-2 font-semibold">Line Items</span>
        <div className="space-y-2">
          {lineItems.map((li) => (
            <div key={li.id} className="flex gap-2 items-center">
              <input
                className={inputCls + " flex-1"}
                value={li.description}
                onChange={(e) => updateLine(li.id, "description", e.target.value)}
                placeholder="Description"
              />
              <input
                type="number"
                min="0"
                step="1"
                className={inputCls + " w-16"}
                value={li.quantity}
                onChange={(e) => updateLine(li.id, "quantity", e.target.value)}
                placeholder="Qty"
              />
              <input
                type="number"
                min="0"
                step="0.01"
                className={inputCls + " w-24"}
                value={li.unitPrice}
                onChange={(e) => updateLine(li.id, "unitPrice", e.target.value)}
                placeholder="Unit $"
              />
              <button
                type="button"
                onClick={() => removeLine(li.id)}
                className="text-[#a8532a] hover:bg-[#F5E3D9] w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
                aria-label="Remove line"
              >
                ✕
              </button>
            </div>
          ))}
        </div>

        <div className="flex items-center gap-2 mt-3 flex-wrap">
          <button type="button" onClick={addBlankLine} className="text-xs text-[#377249] hover:underline font-medium">
            + Add line
          </button>
          {parts.length > 0 && (
            <div className="flex items-center gap-1.5 sm:ml-auto">
              <select
                className="rounded-md border border-[#E2DED5] bg-[#FFFDFA] px-2 py-1 text-xs text-[#1E1A13]"
                value={partToAdd}
                onChange={(e) => setPartToAdd(e.target.value)}
              >
                <option value="">Add from parts…</option>
                {parts.map((p) => (
                  <option key={p.id} value={p.id}>{p.name} ({formatPrice(p.price)})</option>
                ))}
              </select>
              <button
                type="button"
                onClick={addPartLine}
                disabled={!partToAdd}
                className="text-xs px-2 py-1 rounded-md border border-[#377249]/30 text-[#377249] hover:bg-[#377249]/10 disabled:opacity-40"
              >
                Add
              </button>
            </div>
          )}
        </div>
      </div>

      <div className="mt-5 pt-4 border-t border-[#EEEBE5]">
        <span className="block text-[11px] uppercase tracking-wider text-[#75716A] mb-2 font-semibold">Labor &amp; Extras</span>
        <div className="grid sm:grid-cols-2 gap-x-4">
          <Field label="Hours Worked">
            <input
              type="number"
              min="0"
              step="0.25"
              className={inputCls}
              value={laborHours}
              onChange={(e) => setLaborHours(e.target.value)}
              placeholder="0"
            />
          </Field>
          <Field label="Rate Type">
            <select className={inputCls} value={laborRateType} onChange={(e) => setLaborRateType(e.target.value)}>
              {RATE_OPTIONS.map((r) => (
                <option key={r.label} value={r.label}>{r.label} (${r.rate.toFixed(2)}/hr)</option>
              ))}
            </select>
          </Field>
          <Field label="Shop Supplies (%)">
            <input
              type="number"
              min="0"
              step="0.1"
              className={inputCls}
              value={shopSuppliesPercent}
              onChange={(e) => setShopSuppliesPercent(e.target.value)}
              placeholder="0"
            />
          </Field>
          <Field label="Service Call ($)">
            <input
              type="number"
              min="0"
              step="0.01"
              className={inputCls}
              value={serviceCall}
              onChange={(e) => setServiceCall(e.target.value)}
              placeholder="0.00"
            />
          </Field>
        </div>
      </div>

      <div className="mt-4 flex justify-end">
        <table className="text-sm">
          <tbody>
            <tr>
              <td className="pr-4 py-0.5 text-[#75716A]">Parts / line items</td>
              <td className="py-0.5 text-right text-[#1E1A13]">{formatPrice(lineItemsSubtotal)}</td>
            </tr>
            <tr>
              <td className="pr-4 py-0.5 text-[#75716A]">Labor ({laborRateType})</td>
              <td className="py-0.5 text-right text-[#1E1A13]">{formatPrice(laborCost)}</td>
            </tr>
            <tr>
              <td className="pr-4 py-0.5 text-[#75716A]">Shop supplies</td>
              <td className="py-0.5 text-right text-[#1E1A13]">{formatPrice(shopSupplies)}</td>
            </tr>
            <tr>
              <td className="pr-4 py-0.5 text-[#75716A]">Service call</td>
              <td className="py-0.5 text-right text-[#1E1A13]">{formatPrice(serviceCallAmt)}</td>
            </tr>
            <tr className="border-t border-[#EEEBE5]">
              <td className="pr-4 py-0.5 pt-1.5 text-[#75716A]">Subtotal</td>
              <td className="py-0.5 pt-1.5 text-right text-[#1E1A13]">{formatPrice(subtotal)}</td>
            </tr>
            <tr>
              <td className="pr-4 py-0.5 text-[#75716A]">Tax ({taxRate}%)</td>
              <td className="py-0.5 text-right text-[#1E1A13]">{formatPrice(tax)}</td>
            </tr>
            <tr className="font-semibold">
              <td className="pr-4 py-1 text-[#1E1A13]">Total</td>
              <td className="py-1 text-right text-[#1E1A13]">{formatPrice(total)}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div className="flex justify-end gap-2 mt-4">
        <button type="button" onClick={onCancel} className="px-4 py-2 text-sm text-[#75716A] hover:bg-[#F1EEE9] rounded-md">Cancel</button>
        <button type="button" onClick={submit} className="px-4 py-2 text-sm bg-[#377249] text-[#F9F5EC] rounded-md hover:bg-[#135C30] font-medium">Save Quote</button>
      </div>
    </div>
  );
}

// ---------- Work Orders (signature: ticket board) ----------

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function buildWorkOrderHtml(wo, db) {
  const site = db.sites.find((s) => s.id === wo.siteId);
  const cottage = db.cottages.find((c) => c.id === wo.cottageId);
  const customer = site ? db.customers.find((c) => c.siteId === site.id) : null;
  return `
    <div class="wo">
      <div class="wo-head">
        <div>
          <div class="label">Work Order</div>
          <h1>${escapeHtml(wo.title)}</h1>
        </div>
        <div class="meta">
          <div>Date: ${escapeHtml(wo.date)}</div>
          <div>Status: ${escapeHtml(wo.status)}</div>
          ${wo.priority ? `<div>Priority: ${escapeHtml(wo.priority)}</div>` : ""}
        </div>
      </div>
      <table class="wo-table">
        <tr><td class="k">Site</td><td>${site ? escapeHtml(site.number) + (site.section ? ` (${escapeHtml(site.section)})` : "") : "—"}</td></tr>
        ${customer ? `<tr><td class="k">Customer</td><td>${escapeHtml(customer.name)}</td></tr>` : ""}
        <tr><td class="k">Cottage</td><td>${cottage ? escapeHtml(cottage.name) + (cottage.color ? ` — ${escapeHtml(cottage.color)}` : "") : "—"}</td></tr>
        <tr><td class="k">Assigned to</td><td>${escapeHtml(wo.assignedTo || "—")}</td></tr>
        ${Number(wo.laborHours) > 0 ? `<tr><td class="k">Labor</td><td>${escapeHtml(String(wo.laborHours))} hrs × ${escapeHtml(wo.laborRateType || "Rate")} (${formatPrice(wo.laborRate || 0)}/hr) = ${formatPrice((Number(wo.laborHours) || 0) * (Number(wo.laborRate) || 0))}</td></tr>` : ""}
        ${wo.completedDate ? `<tr><td class="k">Completed</td><td>${escapeHtml(wo.completedDate)}</td></tr>` : ""}
      </table>
      <div class="label">Description</div>
      <p class="desc">${escapeHtml(wo.description || "—")}</p>
      <div class="sign">
        <div class="sign-line">Completed by (signature)</div>
        <div class="sign-line">Date</div>
      </div>
    </div>`;
}

function computeQuoteTotals(quote, taxRate) {
  const lineItemsSubtotal = quote.lineItems.reduce((sum, li) => sum + (Number(li.quantity) || 0) * (Number(li.unitPrice) || 0), 0);
  const laborCost = (Number(quote.laborHours) || 0) * (Number(quote.laborRate) || 0);
  const shopSupplies = (lineItemsSubtotal + laborCost) * ((Number(quote.shopSuppliesPercent) || 0) / 100);
  const serviceCall = Number(quote.serviceCall) || 0;
  const subtotal = lineItemsSubtotal + laborCost + shopSupplies + serviceCall;
  const tax = subtotal * (taxRate / 100);
  return { lineItemsSubtotal, laborCost, shopSupplies, serviceCall, subtotal, tax, total: subtotal + tax };
}

function buildQuoteHtml(quote, db, taxRate) {
  const site = db.sites.find((s) => s.id === quote.siteId);
  const cottage = db.cottages.find((c) => c.id === quote.cottageId);
  const customer = db.customers.find((c) => c.id === quote.customerId);
  const { lineItemsSubtotal, laborCost, shopSupplies, serviceCall, subtotal, tax, total } = computeQuoteTotals(quote, taxRate);
  const rows = quote.lineItems
    .map(
      (li) => `<tr>
        <td>${escapeHtml(li.description)}</td>
        <td style="text-align:right;">${escapeHtml(String(li.quantity))}</td>
        <td style="text-align:right;">${formatPrice(li.unitPrice)}</td>
        <td style="text-align:right;">${formatPrice((Number(li.quantity) || 0) * (Number(li.unitPrice) || 0))}</td>
      </tr>`
    )
    .join("");
  const laborHours = Number(quote.laborHours) || 0;
  const laborRate = Number(quote.laborRate) || 0;

  return `
    <div class="wo">
      <div class="wo-head">
        <div>
          <div class="label">Quote</div>
          <h1>${escapeHtml(quote.title)}</h1>
        </div>
        <div class="meta">
          <div>Date: ${escapeHtml(quote.date)}</div>
          <div>Status: ${escapeHtml(quote.status)}</div>
        </div>
      </div>
      <table class="wo-table">
        ${customer ? `<tr><td class="k">Customer</td><td>${escapeHtml(customer.name)}</td></tr>` : ""}
        ${site ? `<tr><td class="k">Site</td><td>${escapeHtml(site.number)}</td></tr>` : ""}
        ${cottage ? `<tr><td class="k">Cottage</td><td>${escapeHtml(cottage.name)}</td></tr>` : ""}
      </table>
      ${quote.notes ? `<div class="label">Notes</div><p class="desc">${escapeHtml(quote.notes)}</p>` : ""}
      ${quote.lineItems.length ? `
      <div class="label" style="margin-top:16px;">Line Items</div>
      <table class="wo-table" style="margin-top:6px;">
        <tr style="font-weight:600;">
          <td>Description</td><td style="text-align:right;">Qty</td><td style="text-align:right;">Unit</td><td style="text-align:right;">Line Total</td>
        </tr>
        ${rows}
      </table>` : ""}
      <div style="display:flex; justify-content:flex-end;">
        <table style="font-size:13px;">
          ${lineItemsSubtotal ? `<tr><td style="padding:2px 16px 2px 0; color:#555;">Parts / line items</td><td style="text-align:right;">${formatPrice(lineItemsSubtotal)}</td></tr>` : ""}
          ${laborHours ? `<tr><td style="padding:2px 16px 2px 0; color:#555;">Labor (${laborHours} hr &times; ${quote.laborRateType || "Rate"} @ ${formatPrice(laborRate)})</td><td style="text-align:right;">${formatPrice(laborCost)}</td></tr>` : ""}
          ${quote.shopSuppliesPercent ? `<tr><td style="padding:2px 16px 2px 0; color:#555;">Shop supplies (${quote.shopSuppliesPercent}%)</td><td style="text-align:right;">${formatPrice(shopSupplies)}</td></tr>` : ""}
          ${serviceCall ? `<tr><td style="padding:2px 16px 2px 0; color:#555;">Service call</td><td style="text-align:right;">${formatPrice(serviceCall)}</td></tr>` : ""}
          <tr><td style="padding:2px 16px 2px 0; color:#555; border-top:1px solid #ccc;">Subtotal</td><td style="text-align:right; border-top:1px solid #ccc;">${formatPrice(subtotal)}</td></tr>
          <tr><td style="padding:2px 16px 2px 0; color:#555;">Tax (${taxRate}%)</td><td style="text-align:right;">${formatPrice(tax)}</td></tr>
          <tr style="font-weight:700;"><td style="padding:4px 16px 2px 0;">Total</td><td style="text-align:right;">${formatPrice(total)}</td></tr>
        </table>
      </div>
      <div class="sign">
        <div class="sign-line">Approved by (signature)</div>
        <div class="sign-line">Date</div>
      </div>
    </div>`;
}

function buildPrintDocument(bodyHtml) {
  return `<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Print</title>
<style>
  body { font-family: Georgia, serif; color: #111; margin: 0; }
  .wo { padding: 32px; page-break-after: always; }
  .wo:last-child { page-break-after: auto; }
  .wo-head { border-bottom: 2px solid #377249; padding-bottom: 10px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: flex-end; }
  .label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #555; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 2px 0 0; font-weight: 700; }
  .meta { font-size: 12px; text-align: right; color: #444; }
  .wo-table { width: 100%; font-size: 13px; margin-bottom: 18px; border-collapse: collapse; }
  .wo-table td { padding: 4px 8px 4px 0; }
  .wo-table td.k { color: #555; width: 120px; }
  .desc { font-size: 14px; line-height: 1.6; min-height: 60px; border-bottom: 1px solid #ccc; padding-bottom: 12px; white-space: pre-wrap; }
  .sign { margin-top: 40px; display: flex; justify-content: space-between; font-size: 12px; }
  .sign-line { width: 45%; border-top: 1px solid #333; padding-top: 4px; }
  .print-hint { padding: 12px 32px; font-family: Georgia, serif; font-size: 12px; color: #666; }
  @media print { .print-hint { display: none; } }
</style>
</head>
<body>
  <div class="print-hint">This file opened for printing. If the print dialog didn't appear automatically, press Ctrl+P (Cmd+P on Mac).</div>
  ${bodyHtml}
  <script>window.onload = function() { window.print(); };<\/script>
</body>
</html>`;
}

function downloadPrintableItems(items, buildItemHtml, filenameBase) {
  const body = items.map(buildItemHtml).join("\n");
  const html = buildPrintDocument(body);
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${filenameBase}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function downloadPrintable(list, db, filenameBase) {
  downloadPrintableItems(list, (wo) => buildWorkOrderHtml(wo, db), filenameBase);
}

function exportDatabase(db) {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `campground-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function buildExcelSheets(db) {
  const siteNumber = (id) => db.sites.find((s) => s.id === id)?.number || "";
  const cottageName = (id) => db.cottages.find((c) => c.id === id)?.name || "";
  const customerName = (id) => db.customers.find((c) => c.id === id)?.name || "";
  const partName = (id) => db.parts.find((p) => p.id === id)?.name || "";
  const taxRate = db.settings?.taxRate ?? 13;

  const sites = db.sites.map((s) => ({
    "Site #": s.number,
    Section: s.section || "",
    Hookups: s.hookups || "",
    Notes: s.notes || "",
  }));

  const cottages = db.cottages.map((c) => ({
    Name: c.name,
    Colour: c.color || "",
    Site: siteNumber(c.siteId),
    Year: c.year || "",
    "Model Number": c.modelNumber || "",
    "Serial Number": c.serialNumber || "",
    Features: c.features || "",
  }));

  const customers = db.customers.map((c) => ({
    Name: c.name,
    Phone: c.phone || "",
    Email: c.email || "",
    Address: c.address || "",
    Site: siteNumber(c.siteId),
  }));

  const workOrders = db.workOrders.map((w) => ({
    Title: w.title,
    Date: w.date,
    Status: w.status,
    Priority: w.priority || "",
    Site: siteNumber(w.siteId),
    Cottage: cottageName(w.cottageId),
    "Assigned To": w.assignedTo || "",
    Hours: w.laborHours || "",
    "Rate Type": w.laborRateType || "",
    "Labor Cost": w.laborHours ? Number(w.laborHours) * Number(w.laborRate || 0) : "",
    Description: w.description || "",
    "Completed Date": w.completedDate || "",
  }));

  const parts = db.parts.map((p) => ({
    Name: p.name,
    Price: p.price,
    "Price (incl. tax)": Number(p.price) * (1 + taxRate / 100),
    "Qty in Stock": p.quantity,
    "Reorder Threshold": p.reorderThreshold ?? 2,
  }));

  const quotes = db.quotes.map((q) => {
    const totals = computeQuoteTotals(q, taxRate);
    return {
      Title: q.title,
      Date: q.date,
      Status: q.status,
      Site: siteNumber(q.siteId),
      Cottage: cottageName(q.cottageId),
      Customer: customerName(q.customerId),
      "Labor Hours": q.laborHours || "",
      "Rate Type": q.laborRateType || "",
      "Shop Supplies %": q.shopSuppliesPercent || "",
      "Service Call": q.serviceCall || "",
      Subtotal: totals.subtotal,
      Tax: totals.tax,
      Total: totals.total,
      "Converted to Work Order": q.workOrderId ? "Yes" : "No",
    };
  });

  const quoteLineItems = [];
  db.quotes.forEach((q) => {
    (q.lineItems || []).forEach((li) => {
      quoteLineItems.push({
        Quote: q.title,
        Description: li.description,
        Quantity: li.quantity,
        "Unit Price": li.unitPrice,
        "Line Total": (Number(li.quantity) || 0) * (Number(li.unitPrice) || 0),
      });
    });
  });

  const partsUsedRows = [];
  db.workOrders.forEach((w) => {
    (w.partsUsed || []).forEach((pu) => {
      partsUsedRows.push({
        "Work Order": w.title,
        Part: partName(pu.partId),
        "Quantity Used": pu.quantity,
      });
    });
  });

  const staff = db.staff.map((s) => ({
    Name: s.name,
    Phone: s.phone || "",
    Email: s.email || "",
    Status: s.status,
  }));

  const recurringTasks = (db.recurringTasks || []).map((t) => ({
    Title: t.title,
    "Frequency (days)": t.frequencyDays,
    "Next Due Date": t.nextDueDate,
    Site: siteNumber(t.siteId),
    Cottage: cottageName(t.cottageId),
    Description: t.description || "",
  }));

  const activityLog = (db.activityLog || []).map((e) => ({
    "Date/Time": new Date(e.ts).toLocaleString(),
    Actor: e.actor,
    Summary: e.summary,
  }));

  return {
    Sites: sites,
    Cottages: cottages,
    Customers: customers,
    "Work Orders": workOrders,
    Parts: parts,
    Quotes: quotes,
    "Quote Line Items": quoteLineItems,
    "Parts Used": partsUsedRows,
    Staff: staff,
    "Recurring Tasks": recurringTasks,
    "Activity Log": activityLog,
  };
}

function exportExcel(db) {
  const sheets = buildExcelSheets(db);
  const wb = XLSX.utils.book_new();
  Object.entries(sheets).forEach(([name, rows]) => {
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  });
  XLSX.writeFile(wb, `campground-export-${new Date().toISOString().slice(0, 10)}.xlsx`);
}

function WorkOrdersView({ db, persist }) {
  const [modal, setModal] = useState(null);
  const [filter, setFilter] = useState("");
  const [recurringOpen, setRecurringOpen] = useState(false);
  const confirm = useConfirm();
  const actor = useCurrentActor();

  const save = (wo) => {
    const exists = db.workOrders.some((x) => x.id === wo.id);
    const workOrders = exists ? db.workOrders.map((x) => (x.id === wo.id ? wo : x)) : [...db.workOrders, wo];
    const activityLog = addLog(db, actor, exists ? `Updated work order "${wo.title}"` : `Created work order "${wo.title}"`);
    persist({ ...db, workOrders, activityLog });
    setModal(null);
  };

  const remove = (id) => {
    const wo = db.workOrders.find((w) => w.id === id);
    const activityLog = addLog(db, actor, `Removed work order "${wo?.title ?? ""}"`);
    persist({ ...db, workOrders: db.workOrders.filter((w) => w.id !== id), activityLog });
    confirm.clear();
  };

  const advance = (wo) => {
    const idx = STATUS.indexOf(wo.status);
    const nextStatus = STATUS[Math.min(idx + 1, STATUS.length - 1)];
    const updated = {
      ...wo,
      status: nextStatus,
      completedDate: nextStatus === "Completed" ? new Date().toISOString().slice(0, 10) : wo.completedDate,
    };
    let parts = db.parts;
    if (nextStatus === "Completed" && wo.partsUsed && wo.partsUsed.length) {
      parts = db.parts.map((p) => {
        const used = wo.partsUsed.find((pu) => pu.partId === p.id);
        if (!used) return p;
        return { ...p, quantity: Math.max(0, (Number(p.quantity) || 0) - (Number(used.quantity) || 0)) };
      });
    }
    const activityLog = addLog(db, actor, `Work order "${wo.title}" marked ${nextStatus}`);
    persist({ ...db, workOrders: db.workOrders.map((w) => (w.id === wo.id ? updated : w)), parts, activityLog });
  };

  const filtered = db.workOrders.filter((w) => {
    if (!filter) return true;
    const site = db.sites.find((s) => s.id === w.siteId);
    const cottage = db.cottages.find((c) => c.id === w.cottageId);
    const hay = `${w.title} ${w.description} ${site?.number || ""} ${cottage?.name || ""} ${w.assignedTo || ""}`.toLowerCase();
    return hay.includes(filter.toLowerCase());
  });

  return (
    <div>
      <div className="flex items-center justify-between mb-5 gap-3 flex-wrap">
        <div>
          <h2 className="font-serif text-2xl text-[#377249] font-semibold">Work Orders</h2>
          <p className="text-sm text-[#75716A]">The board — drag status forward as jobs move along.</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <input
            className={inputCls + " w-48"}
            placeholder="Search work orders…"
            value={filter}
            onChange={(e) => setFilter(e.target.value)}
          />
          <button
            onClick={() => setRecurringOpen(true)}
            className="px-3 py-2 rounded-md border border-[#377249]/30 text-[#377249] text-sm font-medium hover:bg-[#377249]/10 transition whitespace-nowrap"
          >
            Recurring Tasks
          </button>
          {filtered.length > 0 && (
            <button
              onClick={() => downloadPrintable(filtered, db, filter ? "work-orders-filtered" : "work-orders-all")}
              className="px-3 py-2 rounded-md border border-[#377249]/30 text-[#377249] text-sm font-medium hover:bg-[#377249]/10 transition whitespace-nowrap"
            >
              Print {filter ? "results" : "all"}
            </button>
          )}
          <button
            onClick={() => setModal({ mode: "new" })}
            className="px-4 py-2 rounded-md bg-[#377249] text-[#F9F5EC] text-sm font-medium hover:bg-[#135C30] transition shadow-sm whitespace-nowrap"
          >
            + New Work Order
          </button>
        </div>
      </div>

      {db.workOrders.length === 0 ? (
        <EmptyState
          text="No work orders yet. Log your first job."
          action={
            <button onClick={() => setModal({ mode: "new" })} className="text-[#C1652F] text-sm font-medium underline">
              Add a work order
            </button>
          }
        />
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          {STATUS.map((status) => {
            const list = filtered.filter((w) => w.status === status);
            return (
              <div key={status}>
                <div className="flex items-center gap-2 mb-2 px-1">
                  <IconTag className="w-4 h-4 text-[#75716A]" />
                  <h3 className="text-xs uppercase tracking-wider font-semibold text-[#75716A]">{status}</h3>
                  <span className="text-[11px] text-[#9A968D] bg-[#F1EEE9] rounded-full px-1.5">{list.length}</span>
                </div>
                <div className="min-h-[60px]">
                  {list.length === 0 ? (
                    <div className="text-xs text-[#9A968D] italic px-1 py-3">Nothing here</div>
                  ) : (
                    list
                      .slice()
                      .sort((a, b) => (a.date < b.date ? 1 : -1))
                      .map((wo) => (
                        <WorkOrderTicket
                          key={wo.id}
                          wo={wo}
                          db={db}
                          onEdit={(w) => setModal({ mode: "edit", data: w })}
                          onDelete={(w) => confirm.ask(w.id)}
                          onAdvance={advance}
                          onPrint={(w) => downloadPrintable([w], db, `work-order-${w.title.replace(/[^a-z0-9]+/gi, "-").toLowerCase()}`)}
                        />
                      ))
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {modal && (
        <Modal title={modal.mode === "new" ? "New Work Order" : "Edit Work Order"} onClose={() => setModal(null)} wide>
          <WorkOrderForm
            initial={modal.data}
            sites={db.sites}
            cottages={db.cottages}
            staff={db.staff}
            parts={db.parts}
            customers={db.customers}
            onSave={save}
            onCancel={() => setModal(null)}
          />
        </Modal>
      )}

      {recurringOpen && (
        <RecurringTasksModal db={db} persist={persist} onClose={() => setRecurringOpen(false)} />
      )}

      {confirm.target && (
        <ConfirmDeleteModal
          label={db.workOrders.find((w) => w.id === confirm.target)?.title ?? "this work order"}
          onConfirm={() => remove(confirm.target)}
          onCancel={confirm.clear}
        />
      )}
    </div>
  );
}

function WorkOrderForm({ initial, sites, cottages, staff, parts, customers, onSave, onCancel }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [description, setDescription] = useState(initial?.description || "");
  const [siteId, setSiteId] = useState(initial?.siteId || "");
  const [cottageId, setCottageId] = useState(initial?.cottageId || "");
  const [assignedTo, setAssignedTo] = useState(initial?.assignedTo || "");
  const [status, setStatus] = useState(initial?.status || "Open");
  const [priority, setPriority] = useState(initial?.priority || "Medium");
  const [date, setDate] = useState(initial?.date || new Date().toISOString().slice(0, 10));
  const [partsUsed, setPartsUsed] = useState(initial?.partsUsed || []);
  const [partToAdd, setPartToAdd] = useState("");
  const [laborHours, setLaborHours] = useState(initial?.laborHours ?? "");
  const [laborRateType, setLaborRateType] = useState(initial?.laborRateType || RATE_OPTIONS[1].label);

  const laborRate = RATE_OPTIONS.find((r) => r.label === laborRateType)?.rate ?? RATE_OPTIONS[1].rate;
  const laborCost = (Number(laborHours) || 0) * laborRate;

  const siteCustomer = siteId ? (customers || []).find((c) => c.siteId === siteId) : null;

  const handleCottageChange = (val) => {
    setCottageId(val);
    const chosen = (cottages || []).find((c) => c.id === val);
    if (chosen && chosen.siteId) {
      setSiteId(chosen.siteId);
    }
  };

  const addPartUsed = () => {
    const part = (parts || []).find((p) => p.id === partToAdd);
    if (!part) return;
    setPartsUsed((items) =>
      items.some((pu) => pu.partId === part.id)
        ? items.map((pu) => (pu.partId === part.id ? { ...pu, quantity: (Number(pu.quantity) || 0) + 1 } : pu))
        : [...items, { partId: part.id, quantity: 1 }]
    );
    setPartToAdd("");
  };

  const updatePartQty = (partId, quantity) => {
    setPartsUsed((items) => items.map((pu) => (pu.partId === partId ? { ...pu, quantity } : pu)));
  };

  const removePartUsed = (partId) => {
    setPartsUsed((items) => items.filter((pu) => pu.partId !== partId));
  };

  const submit = () => {
    if (!title.trim()) return;
    onSave({
      id: initial?.id || uid(),
      title: title.trim(),
      description: description.trim(),
      siteId: siteId || null,
      cottageId: cottageId || null,
      assignedTo: assignedTo.trim(),
      status,
      priority,
      date,
      completedDate: initial?.completedDate || (status === "Completed" ? new Date().toISOString().slice(0, 10) : null),
      laborHours: Number(laborHours) || 0,
      laborRate,
      laborRateType,
      partsUsed: partsUsed
        .filter((pu) => (Number(pu.quantity) || 0) > 0)
        .map((pu) => ({ partId: pu.partId, quantity: Number(pu.quantity) || 0 })),
    });
  };

  return (
    <div onKeyDown={(e) => { if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") submit(); }}>
      <div className="grid sm:grid-cols-2 gap-x-4">
        <Field label="Title">
          <input className={inputCls} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Fix leaking faucet" autoFocus />
        </Field>
        <Field label="Date">
          <input type="date" className={inputCls} value={date} onChange={(e) => setDate(e.target.value)} />
        </Field>
        <Field label="Site">
          <select className={inputCls} value={siteId} onChange={(e) => setSiteId(e.target.value)}>
            <option value="">None</option>
            {sites.map((s) => (
              <option key={s.id} value={s.id}>Site {s.number}</option>
            ))}
          </select>
        </Field>
        {(siteId || cottageId) && (
          <Field label="Customer">
            <div className={inputCls + " bg-[#F1EEE9] text-[#4B4740]"}>
              {siteCustomer ? siteCustomer.name : "No customer on this site"}
            </div>
          </Field>
        )}
        <Field label="Cottage">
          <select className={inputCls} value={cottageId} onChange={(e) => handleCottageChange(e.target.value)}>
            <option value="">None</option>
            {cottages.map((c) => (
              <option key={c.id} value={c.id}>{c.name}</option>
            ))}
          </select>
        </Field>
        <Field label="Assigned To">
          <input
            className={inputCls}
            value={assignedTo}
            onChange={(e) => setAssignedTo(e.target.value)}
            placeholder="e.g. Dave"
            list="wo-staff-list"
          />
          <datalist id="wo-staff-list">
            {(staff || []).map((s) => (
              <option key={s.id} value={s.name} />
            ))}
          </datalist>
        </Field>
        <Field label="Priority">
          <select className={inputCls} value={priority} onChange={(e) => setPriority(e.target.value)}>
            {PRIORITY.map((p) => (
              <option key={p} value={p}>{p}</option>
            ))}
          </select>
        </Field>
        <Field label="Status">
          <select className={inputCls} value={status} onChange={(e) => setStatus(e.target.value)}>
            {STATUS.map((s) => (
              <option key={s} value={s}>{s}</option>
            ))}
          </select>
        </Field>
        <Field label="Hours Worked">
          <input
            type="number"
            min="0"
            step="0.25"
            className={inputCls}
            value={laborHours}
            onChange={(e) => setLaborHours(e.target.value)}
            placeholder="0"
          />
        </Field>
        <Field label="Rate Type">
          <select className={inputCls} value={laborRateType} onChange={(e) => setLaborRateType(e.target.value)}>
            {RATE_OPTIONS.map((r) => (
              <option key={r.label} value={r.label}>{r.label} (${r.rate.toFixed(2)}/hr)</option>
            ))}
          </select>
        </Field>
      </div>
      {Number(laborHours) > 0 && (
        <p className="text-xs text-[#75716A] -mt-2 mb-3">Labor cost: {formatPrice(laborCost)}</p>
      )}
      <Field label="Description">
        <textarea className={inputCls} rows={3} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="What needs doing, parts needed, etc." />
      </Field>

      {parts && parts.length > 0 && (
        <div className="mt-3">
          <span className="block text-[11px] uppercase tracking-wider text-[#75716A] mb-2 font-semibold">Parts Used</span>
          {partsUsed.length > 0 && (
            <div className="space-y-1.5 mb-2">
              {partsUsed.map((pu) => {
                const part = parts.find((p) => p.id === pu.partId);
                return (
                  <div key={pu.partId} className="flex items-center gap-2 text-sm">
                    <span className="flex-1 text-[#1E1A13]">{part ? part.name : "Unknown part"}</span>
                    <input
                      type="number"
                      min="0"
                      step="1"
                      className={inputCls + " w-16"}
                      value={pu.quantity}
                      onChange={(e) => updatePartQty(pu.partId, e.target.value)}
                    />
                    <button
                      type="button"
                      onClick={() => removePartUsed(pu.partId)}
                      className="text-[#a8532a] hover:bg-[#F5E3D9] w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0"
                      aria-label="Remove part"
                    >
                      ✕
                    </button>
                  </div>
                );
              })}
            </div>
          )}
          <div className="flex items-center gap-1.5">
            <select
              className="rounded-md border border-[#E2DED5] bg-[#FFFDFA] px-2 py-1 text-xs text-[#1E1A13]"
              value={partToAdd}
              onChange={(e) => setPartToAdd(e.target.value)}
            >
              <option value="">Add a part used…</option>
              {parts.map((p) => (
                <option key={p.id} value={p.id}>{p.name} ({p.quantity} in stock)</option>
              ))}
            </select>
            <button
              type="button"
              onClick={addPartUsed}
              disabled={!partToAdd}
              className="text-xs px-2 py-1 rounded-md border border-[#377249]/30 text-[#377249] hover:bg-[#377249]/10 disabled:opacity-40"
            >
              Add
            </button>
          </div>
          <p className="text-[11px] text-[#75716A] mt-1.5">Stock is deducted automatically when this work order is marked Complete.</p>
        </div>
      )}

      <div className="flex justify-end gap-2 mt-4">
        <button type="button" onClick={onCancel} className="px-4 py-2 text-sm text-[#75716A] hover:bg-[#F1EEE9] rounded-md">Cancel</button>
        <button type="button" onClick={submit} className="px-4 py-2 text-sm bg-[#377249] text-[#F9F5EC] rounded-md hover:bg-[#135C30] font-medium">Save Work Order</button>
      </div>
    </div>
  );
}
