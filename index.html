function CalendarView({ db, onGoToTab }) {
  const [cursor, setCursor] = useState(() => {
    const d = new Date();
    return { year: d.getFullYear(), month: d.getMonth() };
  });
  const [selectedDate, setSelectedDate] = useState(null);

  const itemsByDate = {};
  db.workOrders.forEach((w) => {
    if (!w.date) return;
    (itemsByDate[w.date] = itemsByDate[w.date] || []).push({ kind: "Work Order", title: w.title, status: w.status, id: w.id });
  });
  db.quotes.forEach((q) => {
    if (!q.date) return;
    (itemsByDate[q.date] = itemsByDate[q.date] || []).push({ kind: "Quote", title: q.title, status: q.status, id: q.id });
  });

  const first = new Date(cursor.year, cursor.month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(cursor.year, cursor.month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const monthLabel = first.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const pad = (n) => String(n).padStart(2, "0");
  const dateStr = (d) => `${cursor.year}-${pad(cursor.month + 1)}-${pad(d)}`;

  const goMonth = (delta) => {
    setSelectedDate(null);
    setCursor((c) => {
      const d = new Date(c.year, c.month + delta, 1);
      return { year: d.getFullYear(), month: d.getMonth() };
    });
  };

  const selectedItems = selectedDate ? itemsByDate[selectedDate] || [] : [];

  return (
    <div>
      <div className="flex items-center justify-between mb-5 gap-3 flex-wrap">
        <div>
          <h2 className="font-serif text-2xl text-[#377249] font-semibold">Calendar</h2>
          <p className="text-sm text-[#75716A]">Work orders and quotes by date.</p>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => goMonth(-1)} className="w-8 h-8 rounded-md border border-[#E2DED5] hover:bg-[#F1EEE9] text-[#4B4740]">‹</button>
          <span className="text-sm font-semibold text-[#1E1A13] w-36 text-center">{monthLabel}</span>
          <button onClick={() => goMonth(1)} className="w-8 h-8 rounded-md border border-[#E2DED5] hover:bg-[#F1EEE9] text-[#4B4740]">›</button>
        </div>
      </div>

      <div className="rounded-xl border border-[#E2DED5] bg-[#FFFDFA] overflow-hidden">
        <div className="grid grid-cols-7 bg-[#F1EEE9] text-[10px] uppercase tracking-wider text-[#75716A] font-semibold">
          {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d) => (
            <div key={d} className="px-2 py-2 text-center">{d}</div>
          ))}
        </div>
        <div className="grid grid-cols-7">
          {cells.map((d, i) => {
            if (d === null) return <div key={`e${i}`} className="border-t border-[#EEEBE5] min-h-[70px]" />;
            const ds = dateStr(d);
            const items = itemsByDate[ds] || [];
            const isToday = ds === todayISO();
            const isSelected = ds === selectedDate;
            return (
              <button
                key={ds}
                onClick={() => setSelectedDate(ds)}
                className={`border-t border-l border-[#EEEBE5] min-h-[70px] p-1.5 text-left align-top hover:bg-[#F1EEE9] transition ${
                  isSelected ? "bg-[#DDF1E1]" : ""
                }`}
              >
                <div className={`text-[11px] font-medium mb-1 ${isToday ? "text-[#377249] font-bold" : "text-[#4B4740]"}`}>{d}</div>
                <div className="flex flex-wrap gap-0.5">
                  {items.slice(0, 3).map((it, idx) => (
                    <span
                      key={idx}
                      className={`w-1.5 h-1.5 rounded-full ${it.kind === "Work Order" ? "bg-[#377249]" : "bg-[#3E7A72]"}`}
                    />
                  ))}
                  {items.length > 3 && <span className="text-[9px] text-[#9A968D]">+{items.length - 3}</span>}
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {selectedDate && (
        <div className="rounded-xl border border-[#E2DED5] bg-[#FFFDFA] p-4 mt-4">
          <h3 className="font-serif text-base font-semibold text-[#1E1A13] mb-3">{selectedDate}</h3>
          {selectedItems.length === 0 ? (
            <p className="text-xs text-[#75716A]">Nothing on this date.</p>
          ) : (
            <div className="space-y-1.5">
              {selectedItems.map((it, idx) => (
                <button
                  key={idx}
                  onClick={() => onGoToTab(it.kind === "Work Order" ? "workorders" : "quotes")}
                  className="w-full flex items-center justify-between gap-3 text-sm py-1.5 border-b border-[#EEEBE5] last:border-0 hover:bg-[#F1EEE9] text-left px-1 rounded"
                >
                  <span className="text-[#1E1A13]">
                    <span className="text-[10px] uppercase tracking-wide text-[#75716A] mr-2">{it.kind}</span>
                    {it.title}
                  </span>
                  <span className="text-xs text-[#75716A] flex-shrink-0">{it.status}</span>
                </button>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const TABS = [
  { key: "dashboard", label: "Dashboard" },
  { key: "workorders", label: "Work Orders" },
  { key: "calendar", label: "Calendar" },
  { key: "sites", label: "Sites" },
  { key: "cottages", label: "Cottages" },
  { key: "customers", label: "Customers" },
  { key: "parts", label: "Parts" },
  { key: "quotes", label: "Quotes" },
  { key: "staff", label: "Staff" },
];

function AppContent() {
  const { db, loading, error, persist, retry } = useDb();
  const [tab, setTab] = useState("dashboard");
  const [importPending, setImportPending] = useState(null);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const importInputRef = useRef(null);
  const actor = useCurrentActor();
  const generatedRef = useRef(false);

  // Auto-generate work orders from due recurring tasks, once per load.
  useEffect(() => {
    if (!db || generatedRef.current) return;
    const tasks = db.recurringTasks || [];
    if (tasks.length === 0) return;
    const today = todayISO();
    let anyDue = false;
    const newWorkOrders = [];
    const updatedTasks = tasks.map((t) => {
      if (t.nextDueDate > today) return t;
      anyDue = true;
      let nextDue = t.nextDueDate;
      while (nextDue <= today) {
        newWorkOrders.push({
          id: uid(),
          title: t.title,
          description: t.description || "",
          siteId: t.siteId || null,
          cottageId: t.cottageId || null,
          assignedTo: "",
          status: "Open",
          priority: "Medium",
          date: today,
          completedDate: null,
          partsUsed: [],
        });
        const d = new Date(nextDue + "T00:00:00");
        d.setDate(d.getDate() + t.frequencyDays);
        nextDue = d.toISOString().slice(0, 10);
      }
      return { ...t, nextDueDate: nextDue };
    });
    generatedRef.current = true;
    if (anyDue) {
      const activityLog = addLog(
        db,
        actor,
        `Auto-generated ${newWorkOrders.length} work order${newWorkOrders.length === 1 ? "" : "s"} from recurring tasks`
      );
      persist({
        ...db,
        workOrders: [...db.workOrders, ...newWorkOrders],
        recurringTasks: updatedTasks,
        activityLog,
      });
    }
  }, [db, actor, persist]);

  if (loading || !db) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-[#F9F5EC]">
        <p className="text-[#75716A] text-sm">Loading campground records…</p>
      </div>
    );
  }

  const openCount = db.workOrders.filter((w) => w.status !== "Completed").length;

  const handleImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // allow re-selecting the same file later
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        setImportPending(parsed);
      } catch (err) {
        setImportPending({ __invalid: true });
      }
    };
    reader.readAsText(file);
  };

  const confirmImport = () => {
    if (importPending && !importPending.__invalid) {
      const next = { ...emptyDb(), ...importPending };
      next.activityLog = addLog(next, actor, "Restored data from a backup file");
      persist(next);
    }
    setImportPending(null);
  };

  const selectTab = (key) => {
    setTab(key);
    setMobileNavOpen(false);
  };

  return (
    <div className="min-h-screen flex bg-[#F9F5EC] text-[#1E1A13]">
      {/* Mobile top bar */}
      <div className="sm:hidden fixed top-0 left-0 right-0 z-30 flex items-center gap-3 bg-[#FFFDFA] border-b border-[#E2DED5] px-4 py-3">
        <button
          onClick={() => setMobileNavOpen(true)}
          className="w-8 h-8 flex items-center justify-center rounded-md hover:bg-[#F1EEE9] flex-shrink-0"
          aria-label="Open menu"
        >
          <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="1.8">
            <path d="M4 6h16M4 12h16M4 18h16" strokeLinecap="round" />
          </svg>
        </button>
        <div className="font-serif text-[15px] text-[#1E1A13]">Campground Maintenance</div>
      </div>

      {/* Mobile backdrop */}
      {mobileNavOpen && (
        <div className="sm:hidden fixed inset-0 z-30 bg-black/30" onClick={() => setMobileNavOpen(false)} />
      )}

      <aside
        className={`w-[230px] flex-shrink-0 bg-[#FFFDFA] border-r border-[#E2DED5] flex flex-col p-3.5 fixed sm:static inset-y-0 left-0 z-40 transform transition-transform duration-200 ${
          mobileNavOpen ? "translate-x-0" : "-translate-x-full"
        } sm:translate-x-0`}
      >
        <div className="flex items-center gap-2.5 px-2 pb-6">
          <div className="w-8 h-8 rounded-[9px] bg-[#377249] flex items-center justify-center text-white flex-shrink-0">
            <IconTag className="w-4 h-4" />
          </div>
          <div className="font-serif text-[15px] leading-tight text-[#1E1A13]">Campground Maintenance</div>
        </div>

        <nav className="flex flex-col gap-0.5 flex-1">
          {TABS.map((t) => (
            <button
              key={t.key}
              onClick={() => selectTab(t.key)}
              className={`flex items-center gap-2.5 px-3 py-2.5 rounded-[9px] text-[13.5px] font-semibold text-left transition ${
                tab === t.key ? "bg-[#DDF1E1] text-[#28633C]" : "text-[#4B4740] hover:bg-[#F1EEE9]"
              }`}
            >
              <span className={`w-[7px] h-[7px] rounded-[2px] flex-shrink-0 ${tab === t.key ? "bg-[#28633C]" : "bg-[#E2DED5]"}`} />
              {t.label}
            </button>
          ))}
        </nav>

        <div className="px-3 py-3 border-t border-[#E2DED5] mt-1.5 space-y-2">
          <div className="text-[11px] text-[#75716A] font-medium">
            {openCount} open work order{openCount === 1 ? "" : "s"}
          </div>
          <div className="flex items-center gap-3 text-[11px] flex-wrap">
            <button onClick={() => exportDatabase(db)} className="text-[#75716A] hover:text-[#1E1A13] font-medium underline">
              Export backup
            </button>
            <button onClick={() => importInputRef.current?.click()} className="text-[#75716A] hover:text-[#1E1A13] font-medium underline">
              Import backup
            </button>
            <button onClick={() => exportExcel(db)} className="text-[#75716A] hover:text-[#1E1A13] font-medium underline">
              Export as Excel
            </button>
            <button
              onClick={() => firebase.auth().signOut()}
              className="text-[#75716A] hover:text-[#1E1A13] font-medium underline whitespace-nowrap"
            >
              Sign out
            </button>
          </div>
          <input ref={importInputRef} type="file" accept="application/json" onChange={handleImportFile} className="hidden" />
        </div>
      </aside>

      <div className="flex-1 min-w-0 px-6 sm:px-8 py-6 pt-16 sm:pt-6">
        {error && (
          <div className="mb-4 flex items-center justify-between gap-3 text-xs text-[#a8532a] bg-[#F5E3D9] border border-[#e0bfa6] rounded-md px-3 py-2">
            <span>{error}</span>
            <button onClick={retry} className="px-2 py-1 rounded bg-white/60 hover:bg-white font-medium whitespace-nowrap">
              Retry
            </button>
          </div>
        )}

        <main>
          {tab === "dashboard" && <DashboardView db={db} onGoToTab={selectTab} />}
          {tab === "workorders" && <WorkOrdersView db={db} persist={persist} />}
          {tab === "calendar" && <CalendarView db={db} onGoToTab={selectTab} />}
          {tab === "sites" && <SitesView db={db} persist={persist} />}
          {tab === "cottages" && <CottagesView db={db} persist={persist} />}
          {tab === "customers" && <CustomersView db={db} persist={persist} />}
          {tab === "parts" && <PartsView db={db} persist={persist} />}
          {tab === "quotes" && <QuotesView db={db} persist={persist} onGoToWorkOrders={() => selectTab("workorders")} />}
          {tab === "staff" && <StaffView db={db} persist={persist} />}
        </main>
      </div>

      {importPending && (
        importPending.__invalid ? (
          <Modal title="Import failed" onClose={() => setImportPending(null)}>
            <p className="text-sm text-[#4B4740] mb-5">
              That file doesn't look like a valid backup — it may be corrupted or not a JSON export from this app.
            </p>
            <div className="flex justify-end">
              <button
                onClick={() => setImportPending(null)}
                className="px-4 py-2 text-sm bg-[#377249] text-[#F9F5EC] rounded-md hover:bg-[#135C30] font-medium"
              >
                OK
              </button>
            </div>
          </Modal>
        ) : (
          <ConfirmDeleteModal
            label="all current data — replacing it with this backup file"
            onConfirm={confirmImport}
            onCancel={() => setImportPending(null)}
          />
        )
      )}
    </div>
  );
}

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setError(null);
    if (!email.trim() || !password) {
      setError("Enter your email and password.");
      return;
    }
    setLoading(true);
    try {
      await firebase.auth().signInWithEmailAndPassword(email.trim(), password);
    } catch (e) {
      setError(e?.message || "Couldn't sign in. Check your email and password.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div
      className="min-h-screen flex items-center justify-center bg-[#F9F5EC] px-4"
      onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
    >
      <div className="w-full max-w-sm bg-[#FFFDFA] border border-[#E2DED5] rounded-[14px] p-7 shadow-sm">
        <div className="flex items-center gap-2.5 mb-6">
          <div className="w-8 h-8 rounded-[9px] bg-[#377249] flex items-center justify-center text-white flex-shrink-0">
            <IconTag className="w-4 h-4" />
          </div>
          <div className="font-serif text-[15px] text-[#1E1A13]">Campground Maintenance</div>
        </div>
        <h1 className="text-lg font-bold text-[#1E1A13] mb-1">Sign in</h1>
        <p className="text-sm text-[#75716A] mb-5">Use the email and password your manager set up for you.</p>
        <Field label="Email">
          <input
            type="email"
            className={inputCls}
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            autoFocus
            autoComplete="username"
          />
        </Field>
        <Field label="Password">
          <input
            type="password"
            className={inputCls}
            value={password}
            onChange={(e) => setPassword(e.target.value)}
            autoComplete="current-password"
          />
        </Field>
        {error && (
          <p className="text-xs text-[#a8532a] bg-[#F5E3D9] border border-[#e0bfa6] rounded-md px-3 py-2 mb-3">{error}</p>
        )}
        <button
          type="button"
          onClick={submit}
          disabled={loading}
          className="w-full px-4 py-2.5 text-sm bg-[#377249] text-white rounded-[9px] hover:bg-[#135C30] font-semibold disabled:opacity-60"
        >
          {loading ? "Signing in…" : "Sign In"}
        </button>
      </div>
    </div>
  );
}

function AuthGate() {
  const [user, setUser] = useState(undefined); // undefined = checking, null = signed out, object = signed in

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((u) => setUser(u));
    return () => unsub();
  }, []);

  if (user === undefined) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-[#F9F5EC]">
        <p className="text-[#75716A] text-sm">Checking sign-in…</p>
      </div>
    );
  }

  if (!user) {
    return <LoginScreen />;
  }

  return (
    <CurrentUserContext.Provider value={user.email}>
      <AppContent />
    </CurrentUserContext.Provider>
  );
}

function App() {
  return (
    <ErrorBoundary>
      <AuthGate />
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
